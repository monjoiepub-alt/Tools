<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parlons</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1E6470">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;600&display=swap">
<style>
:root{
  --bg:#EEF1EE; --surface:#FFFFFF; --surface-2:#F3F6F4; --ink:#1B2426; --muted:#4F5E60; --line:#D3DCD9;
  --accent:#1E6470; --accent-ink:#FFFFFF; --accent-soft:#D5E9EC; --stamp:#D0662F; --be:#D9A300; --be-soft:#FBF1D2;
  --again:#B3372B; --hard:#9A6208; --good:#2E7D4F;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-display:"Lexend", "Atkinson Hyperlegible", system-ui, sans-serif;
  --shadow:0 1px 2px rgba(27,36,38,.06), 0 6px 20px rgba(27,36,38,.07);
  --fs:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1618; --surface:#172124; --surface-2:#1D292C; --ink:#E4ECEC; --muted:#A3B3B5; --line:#2A3A3D;
    --accent:#7CC4CF; --accent-ink:#0F1618; --accent-soft:#16363C; --stamp:#F08A5D; --be:#E8C04A; --be-soft:#2E2A18;
    --again:#F08A7E; --hard:#E3B45A; --good:#6FCF97;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1618; --surface:#172124; --surface-2:#1D292C; --ink:#E4ECEC; --muted:#A3B3B5; --line:#2A3A3D;
  --accent:#7CC4CF; --accent-ink:#0F1618; --accent-soft:#16363C; --stamp:#F08A5D; --be:#E8C04A; --be-soft:#2E2A18;
  --again:#F08A7E; --hard:#E3B45A; --good:#6FCF97;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
}
:root.big-text{--fs:20px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--fs);line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.fr{font-family:var(--font-body);font-weight:700;letter-spacing:.01em}
.pron{font-family:var(--font-body);color:var(--muted);letter-spacing:.03em;font-weight:400}
.pron .nas{opacity:.55}
.pron .st{color:var(--ink);font-weight:700}

.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 112px;display:flex;flex-direction:column;gap:24px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.mark{position:relative;width:42px;height:38px;border-radius:12px 12px 12px 4px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:22px;flex:none}
.wordmark{font-family:var(--font-display);font-weight:600;font-size:23px;line-height:1.1}
.tagline{font-size:14px;color:var(--muted)}
.pill{font-size:14px;font-weight:700;padding:4px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}

.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:15px}
.section{display:flex;flex-direction:column;gap:12px}
.section h2{font-size:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}

.today{display:flex;flex-direction:column;gap:16px}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:18px;cursor:pointer;min-height:54px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn-primary{background:var(--accent);color:var(--accent-ink);width:100%}
.btn-primary:disabled{opacity:.45;cursor:default}
.btn-soft{background:var(--accent-soft);color:var(--accent)}
.btn-line{background:transparent;border:1.5px solid var(--line)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 140px}

.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-items:stretch}
.step{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px 9px;text-align:center;display:flex;flex-direction:column;gap:4px}
.step .sample{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;line-height:1.2}
.step .sample .fr{font-size:20px}
.step .sample .pron{font-size:13px}
.step .lab{font-size:13px;font-weight:700;line-height:1.25}
.step .when{font-size:12px;color:var(--muted);line-height:1.25}
.step .cnt{font-family:var(--font-display);font-weight:600;font-size:19px;font-variant-numeric:tabular-nums;color:var(--accent)}

.decks{display:flex;flex-direction:column;gap:8px}
.deck{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.dot{width:12px;height:12px;border-radius:4px;background:var(--c);flex:none}
.deck-name{font-weight:700;line-height:1.3}
.deck-name .frn{font-size:14px;color:var(--muted);margin-left:6px;font-weight:400}
.deck-meta{font-size:14px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px;display:flex}
.bar i{display:block;height:100%;background:var(--c)}
.bar i + i{opacity:.4}
.switch{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;margin:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(20px)}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}

/* Study */
.study{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.study-in{max-width:560px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:14px;padding-inline:16px;padding-block:12px 16px;min-height:0}
.study-top{display:flex;align-items:center;gap:12px}
.icon-btn{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:22px;height:22px}
.prog{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.count{font-size:15px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.card{flex:1;min-height:0;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.chip.deckchip{color:var(--ink)}
.chip.deckchip::before{content:"";display:inline-block;width:8px;height:8px;border-radius:3px;background:var(--c);margin-right:6px;vertical-align:1px}
.chip.bechip{background:var(--be-soft);border-color:var(--be);color:var(--ink)}
.chip.gen{color:var(--accent);border-color:var(--accent)}
.ask{font-size:15px;color:var(--muted);font-weight:700}
.front{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;padding-block:8px;min-height:150px}
.fr-main{line-height:1.35;overflow-wrap:anywhere}
.fr-help{font-size:19px}
.en-main{font-family:var(--font-display);font-weight:600;line-height:1.3}
.hint{font-size:15px;color:var(--muted)}
.row-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:7px 14px;font-size:15px;font-weight:700;cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:40px}
.mini svg{width:18px;height:18px}
.answer{border-top:1.5px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.note{font-size:16px;background:var(--surface-2);border-radius:12px;padding:10px 12px;border-left:4px solid var(--accent)}
.note.be{border-left-color:var(--be);background:var(--be-soft)}
.note b{font-weight:700}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade{border-radius:14px;padding:8px 4px;min-height:74px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:15px;line-height:1.2;background:var(--surface);border:1.5px solid var(--g);color:var(--g);text-align:center}
.grade small{font-size:12.5px;font-weight:400;color:var(--muted)}
.grade[data-g="0"]{--g:var(--again)} .grade[data-g="1"]{--g:var(--hard)} .grade[data-g="2"]{--g:var(--good)}
.chip.star{cursor:pointer;color:var(--hard);letter-spacing:.05em;margin-left:auto;font-size:15px;padding:5px 11px;background:var(--surface)}
.done{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
.done .big-fr{font-family:var(--font-display);font-size:30px;font-weight:600}

/* Phrases */
.search{width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.filter{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filter button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:15px;font-weight:700;cursor:pointer;color:var(--muted)}
.filter button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.plist{display:flex;flex-direction:column;gap:8px}
.phrase{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:3px 10px}
.phrase .fr{font-size:20px;line-height:1.4}
.phrase .pron{font-size:15.5px}
.phrase .en{color:var(--muted);font-size:16px}
.phrase .acts{grid-row:1 / span 3;grid-column:2;display:flex;flex-direction:column;gap:6px}
.group-h{font-size:16px;margin-top:8px;display:flex;align-items:center;gap:8px}

/* Progress & settings */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{font-family:var(--font-display);font-weight:600;font-size:28px;display:block;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:14px;color:var(--muted);flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--accent);margin-right:6px;vertical-align:0}
.legend i.light{opacity:.4}
.setting{display:flex;flex-direction:column;gap:8px;padding-block:14px;border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:0}
.setting h3{font-size:17px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 13px;font-size:16px;font-weight:700;cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
textarea{width:100%;min-height:90px;font:13px/1.4 ui-monospace,Menlo,monospace;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink)}
.msg{font-size:15px;font-weight:700;color:var(--good)}
.msg.err{color:var(--again)}
.howto{display:flex;flex-direction:column;gap:10px;font-size:16.5px}
.howto ol,.howto ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.key{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:baseline;font-size:16px}
.key b{font-size:18px}

/* Big show overlay */
.big{position:fixed;inset:0;z-index:20;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:24px 16px;cursor:pointer}
.big .fr{font-size:clamp(34px,10vw,68px);line-height:1.3;overflow-wrap:anywhere}
.big .sub{font-size:21px;color:var(--muted)}
.big .close-hint{font-size:15px;color:var(--muted);position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px))}

/* Lesson + gamification */
.lesson-title{font-size:26px;margin-top:4px}
.lesson-title .frn{font-size:18px;color:var(--muted);font-weight:500;margin-left:4px}
.intro{gap:18px}
.gram{background:var(--surface-2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line)}
.gram-p{font-family:var(--font-display);font-weight:600;font-size:23px;color:var(--accent);line-height:1.3}
.says{display:flex;flex-direction:column;gap:8px}
.say{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.say .fr{font-size:19px;line-height:1.4}
.say .pron{font-size:15px}
.say .en{color:var(--muted);font-size:15.5px}
.wordchips{display:flex;flex-wrap:wrap;gap:6px}
.wchip{font-size:15px;border:1px solid var(--line);border-radius:10px;padding:4px 9px;background:var(--surface-2)}
.wchip .fr{font-size:16px}
.mission{gap:16px}
.mission-head{display:flex;gap:12px;align-items:center}
.big-mark{width:54px;height:48px;font-size:28px;background:var(--stamp);color:#fff}
.task{font-size:19px;font-weight:700;line-height:1.5}
.his{border-left:4px solid var(--stamp);background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:16.5px}
.won{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:8px 12px;font-size:16px}
.mission-mini{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:start;border:1.5px dashed var(--stamp);border-radius:14px;padding:12px}
.mission-mini .mark{background:var(--stamp);color:#fff}
.mission-mini p{font-size:16px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;color:var(--muted);font-weight:700}
.wd i{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:14px;color:var(--muted)}
.wd i.did{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.wd i.les{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wd i.talk{background:var(--stamp);border-color:var(--stamp);color:#fff}
.wd i svg{width:16px;height:16px}
.wd.is-today span{color:var(--ink)}
.lvl{display:flex;flex-direction:column;gap:6px}
.lvl-top{display:flex;justify-content:space-between;gap:8px;font-size:16px;flex-wrap:wrap}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-head .icon-btn{font-size:22px;line-height:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cw{font-size:13px;font-weight:700;color:var(--muted);text-align:center}
.cd{aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--surface);border:1px solid var(--line);position:relative;display:flex;align-items:flex-start;justify-content:flex-start;padding:3px 5px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.cd.did{background:var(--accent-soft)}
.cd.les{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cd.is-today{outline:2px solid var(--ink);outline-offset:-2px}
.stamp{position:absolute;right:3px;bottom:3px;width:21px;height:19px;border-radius:7px 7px 7px 2px;background:var(--stamp);color:#fff;display:grid;place-items:center;transform:rotate(-6deg)}
.stamp svg,.stamp-mini svg{width:12px;height:12px}
.stamp-mini{display:inline-grid;place-items:center;width:18px;height:16px;border-radius:6px 6px 6px 2px;background:var(--stamp);color:#fff;margin-right:6px;vertical-align:-2px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;opacity:.5}
.badge.got{opacity:1;border-color:var(--hard)}
.badge > .bi{flex:none;min-width:42px;height:42px;padding-inline:4px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:15px;background:var(--surface-2);color:var(--muted)}
.badge.got > .bi{background:var(--hard);color:var(--surface)}
.badge b{font-size:15px}
.badge p{font-size:13px;color:var(--muted);line-height:1.35}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plan li{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.plan li.now{border:2px solid var(--accent)}
.plan li.done{opacity:.65}
.pn{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--surface-2);font-variant-numeric:tabular-nums}
.plan li.done .pn{background:var(--good);color:var(--surface)}
.plan li.now .pn{background:var(--accent);color:var(--accent-ink)}

.toast{position:fixed;left:16px;right:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:30;max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;font-size:16px;box-shadow:var(--shadow)}
.kn{color:var(--good)}
.unk{text-decoration:underline dotted var(--muted);text-underline-offset:4px}
.hunt-line{font-size:15.5px;color:var(--muted);margin-bottom:8px}
.sound-card{align-items:center;text-align:center;gap:14px}
.sound-card .eyebrow{align-self:flex-start}
.sound-big{font-family:var(--font-display);font-weight:600;font-size:76px;line-height:1.1;color:var(--accent)}
.sound-say{font-size:22px;font-weight:700}
.sound-say span{color:var(--muted);font-weight:400;font-size:17px}
.trick{font-size:18.5px;line-height:1.55;max-width:32ch}
.example{background:var(--surface-2);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;width:100%;align-items:center}
.ex-word{font-size:28px}
.hl{background:var(--accent-soft);color:var(--accent);border-radius:4px;box-shadow:0 0 0 2px var(--accent-soft)}
.pairs{display:flex;flex-direction:column;gap:6px;width:100%}
.pair{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--surface-2);border-radius:12px;padding:8px 12px;text-align:left}
.pair .fr{font-size:21px}
.pair .pron{font-size:15px}
.quiz-q{font-size:40px;line-height:1.25}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:8px}
.qopt{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;min-height:62px;font-size:19px;font-weight:700;cursor:pointer;padding:6px}
.qopt.ok{background:var(--good);border-color:var(--good);color:var(--surface)}
.qopt.bad{background:var(--again);border-color:var(--again);color:var(--surface)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.st-tile{border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:700;font-size:16px;padding:6px 4px;text-align:center;line-height:1.2}
.st-tile small{display:block;font-weight:400;font-size:12px}
.st-tile.got{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.retry{color:var(--hard);border-color:var(--hard);background:var(--surface)}
.mix .ks{color:var(--accent);font-weight:700}
.mix .hp{color:var(--muted);font-weight:400}
.mix .hp .nas{opacity:.55}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:380px){.ladder{grid-template-columns:1fr}.grade{font-size:14px}}

  {id:'basics', group:'talk', prio:3, name:'First steps', fr:'Les bases', who:'Anyone', reg:'vous', color:'#1E6470', cards:[

  {id:'him', group:'talk', prio:3, name:'With him', fr:'Avec lui', who:'To your husband', reg:'tu', color:'#B9476A', cards:[

const LESSONS = [
  {t:'Hello again!', fr:'Bonjour !', g:{p:'tu or vous?', e:'Tu is for him, his family, friends and children. Vous is for strangers, shops and older people you don\'t know. When in doubt, use vous and wait: if they say "on se tutoie ?" you can switch to tu.', ex:[
    ["Tu viens ce soir ?","Are you coming tonight? (to a friend)"],["Vous venez ce soir ?","Are you coming tonight? (polite)"]]},

  {t:'All about me', fr:'Moi', g:{p:'être: je suis, tu es', e:'Être = to be. je suis (I am), tu es (you are), il/elle est (he/she is). For you as a woman, many words get an -e: je suis japonaise, je suis étudiante.', ex:[

  {t:'Belgian numbers', fr:'Les nombres', g:{p:'avoir: j\'ai … ans', e:'For age, French uses avoir (to have): j\'ai vingt-cinq ans = I am 25. In Belgium, 70 is septante and 90 is nonante. Much easier than France!', ex:[

   m:{task:'Ask him to teach you five Belgian words or sayings his family uses. Use one of them at dinner.',

  {t:'At home', fr:'À la maison', g:{p:'faire + du, de la, des', e:'Faire = to do. Some / any = du (m), de la (f), des (plural): faire du sport, faire de la cuisine, faire des courses. After "not" it becomes de: je ne fais pas de sport.', ex:[

  {t:'Health and first aid', fr:'La santé', g:{p:'j\'ai mal à…', e:'To say what hurts: j\'ai mal à + body part. à + le = au, à + la = à la, à + les = aux. J\'ai mal au dos, j\'ai mal à la tête, j\'ai mal aux pieds.', ex:[

/* ============================================================
   SOUNDS OF THE DAY: reading and listening only, 3 per lesson.
   Each sound has a pattern (re) that finds it in French spelling. The "sound hunt"
   lights up the sounds you already know, and a card's pronunciation help disappears
   once you know every sound in it.
   Matching order (most specific first) is set by `order`; teaching order is the list order.
   ============================================================ */
const L_ = '\\p{L}';                          // any letter
const V_ = 'aeiouyéèêëàâîïôûùœ';             // vowels
const SOUNDS = [
  {id:'ou', label:'ou', say:'oo', order:14, re:`o[uùû]`,
   trick:'"ou" is always "oo", like Japanese う but with round lips, as if you blow out a candle.',
   ex:['vous','nous','bonjour'], vs:[['vous','vu'],['tout','tu']]},
  {id:'u', label:'u', say:'ü', order:40, re:`[uùû]`,
   trick:'A single "u" is the Finnish y! Say "ee", then round your lips without moving your tongue.',
   ex:['tu','salut','une'], vs:[['tu','tout'],['dessus','dessous']]},
  {id:'end', label:'silent end', say:'silent', order:30, re:`(?:e?(?:s|x|z|t|d|p|g)|e)(?!${L_})`,
   trick:'Most last letters are silent: petit, vous, grand. Only C, R, F, L at the end are usually spoken. Think "CaReFuL": sac, mer, neuf, sel.',
   ex:['petit','grand','trois'], vs:[['sac','sa'],['sel','c\'est']]},
  {id:'r', label:'r', say:'throat r', order:38, re:`r+`,
   trick:'The French r is made in the throat, like a soft gargle, or the ch in German "Bach" but with voice. Not the Japanese ら!',
   ex:['merci','rouge','Paris'], vs:[['rue','roue']]},
  {id:'e1', label:'é, -er, -ez', say:'ay', order:20, re:`é|(?<!${L_})(?:et|les|des|mes|tes|ses|ces)(?!${L_})|(?<=${L_}{2})(?:er|ez)(?!${L_})`,
   trick:'é sounds like the Japanese え, short and clean. The endings -er and -ez sound the same: parler, vous parlez. Also: et, les, des, mes.',
   ex:['café','parler','et'], vs:[['parlé','parler'],['les','le']]},
  {id:'uh', label:'e = uh', say:'uh', order:18, re:`(?<=(?<!${L_})(?:[cdjlmnst]|qu))e(?!${L_})|(?<=(?<!${L_})(?:[bcdfglmnprstv]|ch))e(?=[bcdfgjlmnpqrstvz][${V_}])`,
   trick:'An e without an accent in a small word is a soft "uh": le, de, je, que, petit, demain. In fast speech it often disappears: je suis → "shwee".',
   ex:['le','je','demain'], vs:[['le','les'],['de','des']]},
  {id:'on', label:'on', say:'ohn', order:13, re:`on(?![${V_}n])|om(?=[bp])`,
   trick:'Nasal sound: say "oh" and let the air go out through your nose. Don\'t touch the n with your tongue.',
   ex:['bon','non','maison'], vs:[['bon','bonne']]},
  {id:'an', label:'an, en', say:'ahn', order:12, re:`[ae][nm](?![${V_}nm])`,
   trick:'Nasal "ah" through the nose: maman, enfant, temps. "an" and "en" sound exactly the same.',
   ex:['maman','enfant','temps'], vs:[['an','on'],['vent','vont']]},
  {id:'in', label:'in, ain, un', say:'ehn', order:10, re:`(?:[iy]en|ain|aim|ein|in|im|un|um|yn)(?![${V_}nm])`,
   trick:'Nasal "eh" through the nose: vin, pain, bien, un. The mouth is wide open, like a small smile.',
   ex:['vin','pain','bien'], vs:[['vin','vent'],['pain','pont']]},
  {id:'e2', label:'è, ê, ai', say:'eh', order:22, re:`[èêë]|a[iî](?![nm](?![${V_}]))|ei(?!l|[nm](?![${V_}]))|(?<!${L_})(?:est|es)(?!${L_})|(?<=${L_}{2})et(?!${L_})`,
   trick:'An open "eh", like in English "bed": mère, fête, mais. Also "est" (is) and "tu es".',
   ex:['mère','fête','mais'], vs:[['mais','mes']]},
  {id:'o', label:'au, eau', say:'oh', order:9, re:`eau|au`,
   trick:'"au" and "eau" are both a simple "oh": beau, château, aussi. Three letters, one sound!',
   ex:['beau','aussi','l\'eau'], vs:[['beau','bon']]},
  {id:'oi', label:'oi', say:'wa', order:8, re:`oin(?![${V_}])|oi|oy`,
   trick:'"oi" is "wa": moi, trois, voiture. Belgium\'s capital of fries: "wa-lo-nee" (Wallonie)!',
   ex:['moi','trois','soir'], vs:[['moi','mois']]},
  {id:'ch', label:'ch', say:'sh', order:5, re:`ch(?!r)`,
   trick:'"ch" is "sh", never "tch": chat, chocolat, dimanche. Before an r it is a k: Christelle, Christian.',
   ex:['chat','chocolat','dimanche'], vs:[['chat','ça']]},
  {id:'zh', label:'j, ge, gi', say:'zh', order:24, re:`j|g(?=[eiyéèê])`,
   trick:'"j" and a soft "g" are a buzzing "zh", like the s in "measure", or a very soft Japanese じ: je, bonjour, rouge, Belgique.',
   ex:['je','rouge','Belgique'], vs:[['gare','genou']]},
  {id:'eu', label:'eu, œu', say:'ö', order:11, re:`œu|eu|œ`,
   trick:'"eu" is the Finnish ö! deux, bleu, sœur, heure.',
   ex:['deux','bleu','sœur'], vs:[['deux','doux'],['peu','pou']]},
  {id:'qu', label:'qu, gu', say:'k / g', order:6, re:`qu|gu(?=[eiyéèê])`,
   trick:'The u after q or g is silent: qu = k (qui, quatre), gu = hard g (guide, baguette).',
   ex:['qui','quatre','guide'], vs:[['qui','cul']]},
  {id:'h', label:'h, th, ph', say:'no h', order:34, re:`ph|th|(?<![cs])h`,
   trick:'The French h is always silent: hôtel = "o-tel", homme = "om". th = t, ph = f (photo, pharmacie).',
   ex:['hôtel','homme','photo'], vs:[['haut','eau']]},
  {id:'s', label:'ç, ce, ci', say:'s', order:25, re:`ç|c(?=[eiyéèê])`,
   trick:'c before e or i is an "s": merci, ce, ici. With a little tail ç it is also "s": ça, français, garçon.',
   ex:['merci','ça','français'], vs:[['ça','car']]},
  {id:'z', label:'s between vowels', say:'z', order:26, re:`(?<=[${V_}])s(?=[${V_}])`,
   trick:'One s between two vowels buzzes like "z": maison, rose, cuisine. Two s (ss) stay "s": poisson ≠ poison!',
   ex:['maison','rose','cuisine'], vs:[['poisson','poison'],['dessert','désert']]},
  {id:'ill', label:'ill, ail, eil', say:'y', order:3, re:`(?:ou|eu|œu|a|e)(?:il(?!${L_})|ill)|(?<!(?<!${L_})(?:v|m|tranqu))ill`,
   trick:'"ill" usually sounds like "y": fille = "fee-y", famille, travail, soleil. Exceptions: ville, mille, tranquille (with an l).',
   ex:['fille','famille','soleil'], vs:[['fille','ville']]},
  {id:'gn', label:'gn', say:'ny', order:4, re:`gn`,
   trick:'"gn" is "ny", like Japanese にゃ: montagne, champignon, Espagne.',
   ex:['montagne','champignon','Espagne'], vs:[]},
  {id:'tion', label:'-tion', say:'syohn', order:2, re:`tion`,
   trick:'The ending -tion is "syohn", with an s: attention, station, information.',
   ex:['attention','station','solution'], vs:[]},
  {id:'ui', label:'ui', say:'wee', order:7, re:`ui`,

function missionFor(n, deck) {

function lessonFor(n) {

  if (n % 7 === 0) return {n, review: true, t: 'Review day', fr: 'Révision', mission: missionFor(n)};
  // After the 30-day plan: the most important unseen cards, one deck at a time.
  if (S.course.cur && S.course.cur.n === n) {
    const d = DECKS.find(x => x.id === S.course.cur.deck);
    if (d) return {n, auto: true, deck: d.id, t: d.name, fr: d.fr, cards: S.course.cur.ids.map(id => ITEMS[id]).filter(Boolean), mission: missionFor(n, d.id)};

    if (!S.cards[keyOf(it, 'fr')] && !S.cards[keyOf(it, 'en')]) unseen.push({it, d, p: prioOf(it), di, i});
  }));

}
function lessonQueue(L) {

  const words = [...(L.cards || [])];
  const inLesson = new Set(words.map(it => it.id));
  const P = plan(0);
  let due = P.due.filter(e => !inLesson.has(e.it.id));
  // Early days have few reviews: add the most important new words (within the daily limit) so the lesson still has ~30 cards.
  if (!L.review && words.length * per + due.length < 30) {

    return;
  }
  try {
    if (!frVoice) pickVoice();
    // Keep a reference: some browsers stop speaking if the utterance is garbage-collected.
    utter = new SpeechSynthesisUtterance(spoken(it.fr));
    utter.lang = frVoice ? frVoice.lang : 'fr-FR'; if (frVoice) utter.voice = frVoice; utter.rate = S.settings.rate * 0.9;
    let started = false;
    utter.onstart = () => { started = true; };
    utter.onerror = e => {
      if (e.error === 'interrupted' || e.error === 'canceled') return;
      if (fromUser) toast(e.error === 'not-allowed' ? 'Tap Listen once to switch the voice on.' : 'The voice could not play (' + e.error + '). ' + (frVoice ? '' : 'No French voice found. ' + NO_VOICE_HELP));
    };
    const go = () => { synth.resume(); synth.speak(utter); };
    // Cancelling and speaking in the same moment is unreliable on iPhone and Chrome, so wait a little after a cancel.
    if (synth.speaking || synth.pending) { synth.cancel(); setTimeout(go, 120); } else go();
    clearTimeout(speakCheck);
    if (fromUser) speakCheck = setTimeout(() => {
      if (!started && !synth.speaking) toast(frVoice ? 'No sound? Check the volume, and on iPhone the silent switch.' : 'No French voice found on this device. ' + NO_VOICE_HELP);
    }, 2500);
  } catch (e) { if (fromUser) toast('The voice could not play on this device.'); }
}

  const v = document.getElementById('view');
  v.innerHTML = tab === 'phrases' ? viewPhrases() : tab === 'progress' ? viewProgress() : tab === 'settings' ? viewSettings() : viewHome();
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  const s = streakNow();
  document.getElementById('streakPill').textContent = s ? s + (s === 1 ? ' day' : ' days') + ' in a row' : 'Day 1';
  if (tab === 'phrases') {
    preloadFor(DECKS.filter(d => phraseDeck === 'all' || d.id === phraseDeck).map(d => DECK_ITEMS[d.id][0]));
    const inp = document.getElementById('phraseSearch');
    inp.addEventListener('input', () => { phraseQuery = inp.value; document.getElementById('plist').innerHTML = phraseRows(); });
  }
}

/* ============================================================
   STUDY SESSION
   ============================================================ */
let sess = null;
function openStudy() { document.getElementById('study').hidden = false; document.body.style.overflow = 'hidden'; }
function startSession(extraNew = 0) {
  const q = buildQueue(extraNew);
  if (!q.length) { toast('Nothing to practise right now. Come back tomorrow!'); return; }
  sess = {queue: q, pos: 0, answered: 0};
  preloadFor(q.map(e => e.it));
  openStudy();
  showCard();
}
function closeSession() {
  sess = null;
  try { speechSynthesis.cancel(); } catch (e) {}
  player.pause();
  document.getElementById('study').hidden = true;
  document.body.style.overflow = '';
  render();
}
function frBlock(it, lvl, noHelp) {
  const len = it.fr.length;
  const size = len <= 8 ? 44 : len <= 16 ? 36 : len <= 30 ? 29 : 24;
  const help = pronHTML(it);
  const main = `<div class="fr-main fr${lvl === 0 ? ' mix' : ''}" style="font-size:${size}px">${lvl === 0 ? mixHTML(it) : frText(it.fr)}</div>`;
  if (!help) return main;
  return main + (noHelp ? '' : `<div class="pron fr-help" data-peek="help" hidden>${help}</div>`);
}
function peekButtons(it, lvl, noHelp) {
  let b = listenBtn(it);
  if (!noHelp && PRON[spoken(it.fr)]) b += `<button class="mini" data-act="peek">Show pronunciation</button>`;
  return `<div class="row-btns">${b}</div>`;
}
function showCard() {
  const box = document.getElementById('studyIn');
  // A second try waits until its turn (3–6 cards later). When no other cards are left, it comes now.
  const waiting = sess.retries || [];
  const ready = waiting.filter(r => r.at <= sess.answered || sess.pos >= sess.queue.length).sort((a, b) => a.at - b.at)[0];
  if (ready) { waiting.splice(waiting.indexOf(ready), 1); sess.queue.splice(sess.pos, 0, ready.entry); }
  const entry = sess.queue[sess.pos];
  const total = sess.queue.length + waiting.length;
  const pct = Math.round(sess.pos / total * 100);
  const top = `<div class="study-top"><button class="icon-btn" data-act="close" aria-label="Stop studying">${ICON_CLOSE}</button><div class="prog"><i style="width:${pct}%"></i></div><span class="count">${sess.pos}/${total}</span></div>`;
  if (!entry) {
    sess.cur = null;
    if (sess.mode === 'lesson') return finishLesson();
    box.innerHTML = top + `<div class="done"><div class="big-fr">Bien joué !</div><p style="font-size:19px">Well done. You answered ${sess.answered} cards.</p>
      <div class="btn-row" style="width:100%"><button class="btn btn-soft" data-act="more">Learn 5 more</button><button class="btn btn-primary" data-act="close">Finish</button></div></div>`;
    return;
  }
  const {it, dir, k} = entry;
  const st = S.cards[k];
  const noHelp = !!entry.noHelp;
  const lvl = noHelp ? Math.max(1, levelFor(it)) : levelFor(it);
  sess.cur = {it, lvl, dir, k, noHelp, revealed: false};
  const chips = `<div class="chips"><span class="chip deckchip" style="--c:${it.deck.color}">${esc(it.deck.name)}</span>${entry.retry ? '<span class="chip retry">second try</span>' : st ? '' : '<span class="chip">new</span>'}<span class="chip">${dir === 'fr' ? 'understand' : 'speak'}</span><span class="chip">${LEVELS[lvl]}</span>${REG_LABEL[it.reg] ? `<span class="chip">${it.reg}</span>` : ''}${it.be ? '<span class="chip bechip">Belgian</span>' : ''}<button class="chip star" id="starBtn" data-act="prio" aria-label="Importance: tap to change">${PRIO_TEXT[prioOf(it)]}</button></div>`;
  let front;
  if (dir === 'fr') {
    front = `<div class="ask">${noHelp ? 'Again, without the help. Can you say it?' : 'What does this mean?'}</div><div class="front">${frBlock(it, lvl, noHelp)}${peekButtons(it, lvl, noHelp)}</div>`;
  } else {
    const ctx = REG_LABEL[it.reg] ? `${it.deck.who.toLowerCase()}, ${it.reg}` : it.deck.who.toLowerCase();
    front = `<div class="ask">How do you say this in French? <span style="font-weight:400">(${esc(ctx)})</span></div>
      <div class="front"><div class="en-main" style="font-size:${it.en.length > 40 ? 25 : 31}px">${esc(it.en)}</div><div class="hint">Say it out loud first, then check.</div></div>`;
  }
  box.innerHTML = top + `<div class="card" id="card">${chips}${front}<div id="answer"></div></div>
    <div id="actions"><button class="btn btn-primary" data-act="reveal">Show answer</button></div>`;
  if (dir === 'fr' && S.settings.autoplay) speak(it, false);
}
function renderGrades() {
  const {it, k} = sess.cur;
  const st = S.cards[k] || blankState();
  document.getElementById('actions').innerHTML = `<div class="grades">${GRADES.map((l, g) => `<button class="grade" data-act="grade" data-g="${g}">${l}<small>${fmtIvl(nextOf(st, g, it), g)}</small></button>`).join('')}</div>`;
}
function reveal() {
  const {it, lvl, dir, noHelp} = sess.cur;
  if (sess.cur.revealed) return;
  sess.cur.revealed = true;
  const head = dir === 'fr'
    ? `<div class="en-main" style="font-size:25px">${esc(it.en)}</div>`
    : `<div class="front" style="min-height:0;padding:0">${frBlock(it, lvl, noHelp)}${peekButtons(it, lvl, noHelp)}</div>`;
  const chips = genChip(it) ? `<div class="chips">${genChip(it)}</div>` : '';
  document.getElementById('answer').innerHTML = `<div class="answer">${head}${chips}${it.note ? `<div class="note ${it.be ? 'be' : ''}">${it.be ? '<b>Belgian French.</b> ' : ''}${esc(it.note)}</div>` : ''}</div>`;
  renderGrades();
  if (dir === 'en' && S.settings.autoplay) speak(it, false);
}
function cyclePrio() {
  const it = sess.cur.it;
  const p = prioOf(it) === 1 ? 3 : prioOf(it) - 1;
  if (p === it.prio) delete S.prio[it.id]; else S.prio[it.id] = p;
  save();
  document.getElementById('starBtn').textContent = PRIO_TEXT[p];
  if (sess.cur.revealed) renderGrades();
}
function grade(g) {
  const {it, k} = sess.cur;
  freshDay();
  const t = today();
  const isNew = !S.cards[k];
  const st = S.cards[k] || blankState();
  const r = nextOf(st, g, it);
  st.ease = r.ease;
  // Each card gets ONE second try in a session, 3 to 6 cards later. If it is still hard,
  // it comes back in tomorrow's lesson, so every lesson ends at its planned size.
  const entry = sess.queue[sess.pos];
  const retry = e => (sess.retries || (sess.retries = [])).push({entry: e, at: sess.answered + 3 + Math.floor(Math.random() * 4)});
  if (r.sound) {
    // From now on this phrase is shown without the pronunciation help.
    S.nohelp[it.id] = 1;
    if (isNew) { st.due = t; st.tried = true; }
    if (!entry.retry) retry({...entry, noHelp: true, retry: true});
    else if (st.due <= t) st.due = t + 1;
  } else if (r.again) {
    if (r.lapsed) st.lapses++;
    st.ivl = r.ivl; st.lapsed = r.lapsed || st.lapsed; st.tried = true;
    if (!entry.retry) { st.due = t; retry({...entry, retry: true}); }
    else st.due = t + 1;
  } else {
    st.ivl = r.ivl; st.due = t + r.ivl; st.reps++; delete st.lapsed; delete st.tried;
  }
  S.cards[k] = st;
  if (isNew) S.day.newSeen++;
  S.day.reviews++; S.total++; S.xp++; logToday().n++;
  bumpStreak();
  save();
  sess.answered++;
  sess.pos++;
  showCard();
}

/* ============================================================
   DAILY LESSON FLOW: sounds of the day → topic + grammar → cards → conversation mission
   ============================================================ */
function sayRow(it) {
  return `<div class="say"><div><div class="fr">${frText(it.fr)}</div><div class="pron">${pronHTML(it)}</div>${it.en ? `<div class="en">${esc(it.en)}</div>` : ''}</div>
    <button class="icon-btn" data-act="speak" data-id="${esc(it.id)}" aria-label="Listen">${ICON_SPEAK}</button></div>`;
}
/* ---------- Step 1: sounds of the day ---------- */
function firstSpan(it, uid) { return it.spans.find(sp => sp.u === uid); }
const highlight = (it, uid) => markUp(it.fr, it.spans.filter(sp => sp.u === uid).slice(0, 1), () => true, 'hl');
function exampleFor(u) {
  let best = null;
  DECKS.forEach(d => { if (d.id === 'grammar') return; DECK_ITEMS[d.id].forEach(it => {
    if (!firstSpan(it, u.id) || it.fr.length > 16 || u.ex.includes(it.fr)) return;
    const score = it.prio * 10 - it.fr.length / 2 + (d.group === 'talk' ? 4 : 0);
    if (!best || score > best.s) best = {it, s: score};
  }); });
  return best && best.it;
}
function soundsTop(label, pct) {
  return `<div class="study-top"><button class="icon-btn" data-act="close" aria-label="Close">${ICON_CLOSE}</button><div class="prog"><i style="width:${pct}%"></i></div><span class="count">${label}</span></div>`;
}
function showSound() {
  const K = sess.snd, u = K.units[K.i];
  const ex = exampleFor(u);
  document.getElementById('studyIn').innerHTML = soundsTop(`Sound ${K.i + 1}/${K.units.length}`, (K.i / (K.units.length + 1)) * 100) + `
    <div class="card sound-card"><div class="eyebrow">Sound of the day · ${K.i + 1} of ${K.units.length}</div>
      <div class="sound-big">${esc(u.label)}</div>
      <div class="sound-say"><span>sounds like</span> ${esc(u.say)}</div>
      <p class="trick">${esc(u.trick)}</p>
      <div class="says" style="width:100%">${u.exItems.map(it => `<div class="say"><div style="text-align:left"><div class="fr">${highlight(it, u.id)}</div><div class="pron">${pronHTML(it)}</div></div>
        <button class="icon-btn" data-act="speak" data-id="${esc(it.id)}" aria-label="Listen">${ICON_SPEAK}</button></div>`).join('')}</div>
      ${u.vsItems.length ? `<div style="width:100%;display:flex;flex-direction:column;gap:6px"><div class="eyebrow" style="text-align:left">Listen to the difference</div>
        <div class="pairs">${u.vsItems.map(p => p.map(it => `<div class="pair"><div><div class="fr">${frText(it.fr)}</div><div class="pron">${pronHTML(it)}</div></div><button class="icon-btn" data-act="speak" data-id="${esc(it.id)}" aria-label="Listen">${ICON_SPEAK}</button></div>`).join('')).join('')}</div></div>` : ''}
      ${ex ? `<div class="example"><div class="eyebrow">In a card you are learning</div><div class="fr ex-word">${highlight(ex, u.id)}</div><div class="muted">${esc(ex.en)}</div></div>` : ''}
    </div>
    <div><button class="btn btn-primary" data-act="nextsound">${K.i + 1 < K.units.length ? 'Next sound' : 'Quick quiz'}</button></div>`;
}
const SAYS = [...new Set(SOUNDS.map(u => u.say))];
function quizFrom(u, n) {
  const words = shuffle([...u.exItems, exampleFor(u)].filter(it => it && firstSpan(it, u.id)));
  return words.slice(0, n).map(it => ({it, u}));
}
function startSoundQuiz() {
  const K = sess.snd;
  const known = shuffle(SOUNDS.filter(u => S.snd[u.id] && !K.units.includes(u))).slice(0, K.units.length ? 4 : 8);
  K.quiz = shuffle([...K.units.flatMap(u => quizFrom(u, 2)), ...known.flatMap(u => quizFrom(u, 1))]);
  K.qi = 0; K.missed = new Set();
  if (!K.quiz.length) return finishSounds();
  showSoundQuestion();
}
function showSoundQuestion() {
  const K = sess.snd, Q = K.quiz[K.qi];
  const opts = shuffle([Q.u.say, ...shuffle(SAYS.filter(x => x !== Q.u.say)).slice(0, 3)]);
  K.answered = false;
  document.getElementById('studyIn').innerHTML = soundsTop(`Quiz ${K.qi + 1}/${K.quiz.length}`, 50 + (K.qi / K.quiz.length) * 50) + `
    <div class="card sound-card"><div class="eyebrow">How do you say the blue part?</div>
      <div class="fr quiz-q">${highlight(Q.it, Q.u.id)}</div>
      <div class="row-btns">${listenBtn(Q.it)}</div>
      <div class="quiz-opts">${opts.map(o => `<button class="qopt" data-act="sq" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>
    </div>`;
}
function answerSound(v, el) {
  const K = sess.snd, Q = K.quiz[K.qi];
  if (K.answered) return;
  K.answered = true;
  const ok = v === Q.u.say;
  document.querySelectorAll('.qopt').forEach(b => { if (b.dataset.v === Q.u.say) b.classList.add('ok'); });
  if (!ok) { el.classList.add('bad'); const key = Q.it.id + Q.u.id; if (!K.missed.has(key)) { K.missed.add(key); K.quiz.push(Q); } }
  else S.xp++;
  setTimeout(() => { K.qi++; if (K.qi < K.quiz.length) showSoundQuestion(); else finishSounds(); }, ok ? 650 : 1600);
}
function finishSounds() {
  const K = sess.snd;
  K.units.forEach(u => { S.snd[u.id] = S.course.day; });
  if (K.units.length) S.sndPos = SOUNDS.indexOf(K.units[K.units.length - 1]) + 1;
  save();
  afterSounds();
}
function afterSounds() {
  const {L, queue} = sess;
  if (L.g || L.cards) showIntro(); else if (queue.length) showCard(); else finishLesson();
}

function startLesson() {
  const L = lessonFor(S.course.day);
  const q = lessonQueue(L);
  sess = {mode: 'lesson', L, queue: q, pos: 0, answered: 0, xp0: S.xp};
  sess.snd = {units: L.review ? [] : soundChunk(), i: 0};
  preloadFor([...q.map(e => e.it), ...L.mission.sayItems, ...sess.snd.units.flatMap(u => u.exItems), ...(L.g ? L.g.ex.map(([f]) => ITEMS['grammar|' + f]) : [])]);
  openStudy();
  if (sess.snd.units.length) showSound();
  else if (SOUNDS.filter(u => S.snd[u.id]).length >= 4) startSoundQuiz();
  else afterSounds();
}
function showIntro() {
  const {L, queue} = sess;
  const newCount = (L.cards || []).length;
  document.getElementById('studyIn').innerHTML = `
    <div class="study-top"><button class="icon-btn" data-act="close" aria-label="Close">${ICON_CLOSE}</button><div class="prog"><i style="width:0%"></i></div><span class="count">Day ${L.n}</span></div>
    <div class="card intro">
      <div><div class="eyebrow">Day ${L.n} · today's topic</div>
      <h1 class="lesson-title">${esc(L.t)} <span class="frn">${esc(L.fr)}</span></h1></div>
      ${L.g ? `<div class="gram">
        <div class="eyebrow">Grammar of the day</div>
        <div class="gram-p">${esc(L.g.p)}</div>
        <p>${esc(L.g.e)}</p>
        <div class="says">${L.g.ex.map(([f]) => sayRow(ITEMS['grammar|' + f])).join('')}</div>
      </div>` : ''}
      ${newCount ? (() => { const h = huntStats(L.cards); return `<div><div class="eyebrow" style="margin-bottom:4px">New today · ${newCount}</div>
        ${h.all ? `<p class="hunt-line">Sound hunt: you already know <b class="kn">${h.known}</b> of the ${h.all} tricky sounds in today's words. They are green.</p>` : ''}
        <div class="wordchips">${L.cards.map(it => `<span class="wchip"><span class="fr">${hunt(it)}</span> · ${esc(it.en.length > 30 ? it.en.slice(0, 28) + '…' : it.en)}</span>`).join('')}</div></div>`; })() : ''}
    </div>
    <div><button class="btn btn-primary" data-act="startcards">Start the cards · ${queue.length} cards</button></div>`;
}
function finishLesson() {
  const {L} = sess;
  const t = today();
  if (!sess.finished) {
    sess.finished = true;
    if (S.course.day === L.n) {
      S.course.day = L.n + 1; S.course.last = t; S.course.cur = null;
      S.course.pending = {n: L.n, deck: L.deck || null};
      S.xp += 20; logToday().l = L.n; bumpStreak();
      save();
    }
  }
  showMission(L.mission, L.n, S.xp - sess.xp0);
}
function showMission(m, n, gained) {
  document.getElementById('studyIn').innerHTML = `
    <div class="study-top"><button class="icon-btn" data-act="close" aria-label="Close">${ICON_CLOSE}</button><div class="prog"><i style="width:100%"></i></div><span class="count">Day ${n}</span></div>
    <div class="card mission">
      ${gained != null ? `<div class="won"><b>Bravo !</b> Day ${n} done · <b>+${gained} XP</b></div>` : ''}
      <div class="mission-head"><span class="mark big-mark" aria-hidden="true">P</span><div><div class="eyebrow">Tonight's conversation</div><h2>Talk with him</h2></div></div>
      <p class="task">${esc(m.task)}</p>
      <div><div class="eyebrow" style="margin-bottom:6px">You can start with</div><div class="says">${m.sayItems.map(sayRow).join('')}</div></div>
      <div class="his"><div class="eyebrow">His part</div><p>${esc(m.his)}</p></div>
    </div>
    <div class="btn-row"><button class="btn btn-line" data-act="close">Later</button><button class="btn btn-primary" data-act="talked" style="flex:2 1 180px">We talked! +30 XP</button></div>`;
}
function openMission() {
  const P = S.course.pending; if (!P) return;
  sess = {mode: 'mission', queue: [], pos: 0, answered: 0};
  preloadFor(missionFor(P.n, P.deck).sayItems);
  openStudy();
  showMission(missionFor(P.n, P.deck), P.n, null);
}
function talked() {
  if (S.course.pending) {
    S.course.pending = null; S.talks++; S.xp += 30; logToday().t = true;
    bumpStreak();
    save();
    toast('Super ! +30 XP. A stamp is on today in your calendar.');
  }
  closeSession();
}

/* ============================================================
   BIG DISPLAY (show a phrase to someone)
   ============================================================ */
function showBig(it) {
  const b = document.getElementById('big');
  b.innerHTML = `<div class="fr">${frText(it.fr)}</div><div class="sub pron">${pronHTML(it)}</div><div class="sub">${esc(it.en)}</div><div class="close-hint">Tap anywhere to close</div>`;
  b.hidden = false;
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click', e => {
  const tb = e.target.closest('.tab');
  if (tb) { tab = tb.dataset.tab; resetArmed = false; backupMsg = ''; try { localStorage.setItem(KEY + '.tab', tab); } catch (er) {} render(); window.scrollTo(0, 0); return; }
  if (e.target.closest('#big')) { document.getElementById('big').hidden = true; return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'start') startSession();
  else if (act === 'lesson') startLesson();
  else if (act === 'nextsound') { sess.snd.i++; if (sess.snd.i < sess.snd.units.length) showSound(); else startSoundQuiz(); }
  else if (act === 'sq') answerSound(el.dataset.v, el);
  else if (act === 'startcards') { if (sess.queue.length) showCard(); else finishLesson(); }
  else if (act === 'talked') talked();
  else if (act === 'mission') openMission();
  else if (act === 'cal') { calOff += +el.dataset.d; render(); }
  else if (act === 'more') { const q = buildQueue(5); if (q.length) { sess = {queue: q, pos: 0, answered: sess ? sess.answered : 0}; preloadFor(q.map(x => x.it)); openStudy(); showCard(); } else toast('No more new cards in your decks right now.'); }
  else if (act === 'close') closeSession();
  else if (act === 'reveal') reveal();
  else if (act === 'grade') grade(+el.dataset.g);
  else if (act === 'prio') cyclePrio();
  else if (act === 'speak') speak(ITEMS[el.dataset.id]);
  else if (act === 'big') showBig(ITEMS[el.dataset.id]);
  else if (act === 'peek') document.querySelectorAll('[data-peek="help"]').forEach(n => { n.hidden = !n.hidden; });
  else if (act === 'pdeck') { phraseDeck = el.dataset.id; render(); }
  else if (act === 'set') {
    let v = el.dataset.v; const k = el.dataset.k;
    if (k === 'newPerDay' || k === 'rate' || k === 'soundsPerDay') v = +v;
    else if (k === 'autoplay') v = v === 'true';
    S.settings[k] = v; save(); render();
  }
  else if (act === 'testvoice') speak(ITEMS['basics|Bonjour !']);
  else if (act === 'backup') {
    const code = JSON.stringify(S);
    const done = ok => { backupMsg = ok ? 'Backup code copied. Paste it somewhere safe.' : 'Copy did not work. The code is in the box below: select it and copy it.'; render(); if (!ok) { const b2 = document.getElementById('restoreBox'); b2.value = code; b2.select(); } };
    try { navigator.clipboard.writeText(code).then(() => done(true), () => done(false)); } catch (er) { done(false); }
  }
  else if (act === 'restore') {
    const txt = document.getElementById('restoreBox').value.trim();
    try {
      const s = JSON.parse(txt);
      if (!s || typeof s.cards !== 'object') throw new Error();
      S = fromSaved(s); save(); backupMsg = 'Progress restored.';
    } catch (er) { backupMsg = '!This code could not be read. Check that you pasted the whole code.'; }
    render();
  }
  else if (act === 'reset') {
    if (!resetArmed) { resetArmed = true; render(); return; }
    const keep = S.settings; S = blankSave(); S.settings = keep;
    save(); resetArmed = false; render();
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.act === 'deck') { S.settings.decks[el.dataset.id] = el.checked; save(); render(); }
});
document.addEventListener('keydown', e => {
  if (!sess || !sess.cur || document.getElementById('study').hidden) return;
  if (e.key === 'Escape') return closeSession();
  if (!sess.cur.revealed && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); reveal(); }
  else if (sess.cur.revealed && ['1', '2', '3'].includes(e.key)) grade(+e.key - 1);
});

try { pickVoice(); speechSynthesis.addEventListener('voiceschanged', () => { pickVoice(); if (tab === 'settings') render(); }); } catch (e) {}
render();
loadBundle('basics'); loadBundle('say');
</script>
