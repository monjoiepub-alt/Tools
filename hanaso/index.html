<title>Hanasō</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2B4C8C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#F4F6FA; --ink:#18202F; --muted:#525D71; --line:#D5DBE5;
  --accent:#2B4C8C; --accent-ink:#FFFFFF; --accent-soft:#DCE4F3; --shu:#C8412A;
  --again:#B3372B; --hard:#9A6208; --good:#2E7D4F; --easy:#2B4C8C;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-display:"Zen Maru Gothic", "Atkinson Hyperlegible", system-ui, sans-serif;
  --font-jp:"Klee One", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
  --shadow:0 1px 2px rgba(24,32,47,.06), 0 6px 20px rgba(24,32,47,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10141C; --surface:#181E29; --surface-2:#1F2633; --ink:#E6EAF2; --muted:#A3ADBF; --line:#2D3546;
    --accent:#93B2EE; --accent-ink:#10141C; --accent-soft:#1F2C47; --shu:#E0674F;
    --again:#F08A7E; --hard:#E3B45A; --good:#6FCF97; --easy:#93B2EE;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10141C; --surface:#181E29; --surface-2:#1F2633; --ink:#E6EAF2; --muted:#A3ADBF; --line:#2D3546;
  --accent:#93B2EE; --accent-ink:#10141C; --accent-soft:#1F2C47; --shu:#E0674F;
  --again:#F08A7E; --hard:#E3B45A; --good:#6FCF97; --easy:#93B2EE;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.2;text-wrap:balance;margin:0}
p{margin:0}
.jp{font-family:var(--font-jp);font-weight:600}
rt{font-family:var(--font-jp);font-size:.48em;color:var(--muted);font-weight:600}
.hide-rt rt{visibility:hidden}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 110px;display:flex;flex-direction:column;gap:22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.hanko{width:42px;height:42px;border-radius:9px;background:var(--shu);color:#fff;display:grid;place-items:center;font-family:var(--font-jp);font-size:24px;transform:rotate(-4deg);flex:none}
.wordmark{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.1}
.wordmark small{font-family:var(--font-jp);font-size:14px;color:var(--muted);margin-left:6px}
.tagline{font-size:13.5px;color:var(--muted)}
.pill{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}

.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.section{display:flex;flex-direction:column;gap:12px}
.section h2{font-size:19px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}

.today{display:flex;flex-direction:column;gap:16px}
.today-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.num{display:flex;flex-direction:column;gap:2px}
.num b{font-family:var(--font-display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.num span{font-size:13.5px;color:var(--muted)}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:17px;cursor:pointer;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--accent);color:var(--accent-ink);width:100%}
.btn-primary:disabled{opacity:.45;cursor:default}
.btn-soft{background:var(--accent-soft);color:var(--accent)}
.btn-line{background:transparent;border:1.5px solid var(--line)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 140px}

.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-items:stretch}
.step{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px 9px;text-align:center;display:flex;flex-direction:column;gap:4px;position:relative}
.step .sample{font-size:22px;min-height:40px;display:flex;align-items:flex-end;justify-content:center;line-height:1.1}
.step .sample.rom{font-family:var(--font-body);font-weight:700;font-size:19px}
.step .lab{font-size:12px;font-weight:700;line-height:1.2}
.step .when{font-size:11.5px;color:var(--muted);line-height:1.2}
.step .cnt{font-family:var(--font-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;color:var(--accent)}
.step + .step::before{content:"";position:absolute;left:-6px;top:30px;width:6px;height:2px;background:var(--line)}

.decks{display:flex;flex-direction:column;gap:8px}
.deck{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.dot{width:12px;height:12px;border-radius:4px;background:var(--c)}
.deck-name{font-weight:700;line-height:1.25}
.deck-name .jp{font-size:13px;color:var(--muted);margin-left:6px;font-weight:600}
.deck-meta{font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px;display:flex}
.bar i{display:block;height:100%;background:var(--c)}
.bar i + i{opacity:.4}
.switch{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;margin:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(20px)}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}

/* Study */
.study{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.study-in{max-width:560px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:14px;padding-inline:16px;padding-block:12px 16px;min-height:0}
.study-top{display:flex;align-items:center;gap:12px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:22px;height:22px}
.prog{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.count{font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.card{flex:1;min-height:0;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.chip.deckchip{color:var(--ink)}
.chip.deckchip::before{content:"";display:inline-block;width:8px;height:8px;border-radius:3px;background:var(--c);margin-right:6px;vertical-align:1px}
.ask{font-size:14px;color:var(--muted);font-weight:700}
.front{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;padding-block:8px;min-height:150px}
.jp-main{line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
.jp-main.rom{font-family:var(--font-body);font-weight:700}
.jp-sub{font-size:17px;color:var(--muted)}
.jp-sub.jp{font-size:19px}
.en-main{font-family:var(--font-display);font-weight:700;line-height:1.3}
.hint{font-size:14px;color:var(--muted)}
.row-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:36px}
.mini svg{width:18px;height:18px}
.answer{border-top:1.5px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.forms{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;align-items:baseline}
.forms dt{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.forms dd{margin:0;font-size:18px}
.forms dd.jp{font-size:21px}
.note{font-size:15px;background:var(--surface-2);border-radius:12px;padding:10px 12px;border-left:3px solid var(--shu)}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade{border:0;border-radius:14px;padding:10px 4px;min-height:62px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;background:var(--surface);border:1.5px solid var(--g);color:var(--g)}
.grade small{font-size:12.5px;font-weight:400;color:var(--muted)}
.grade[data-g="0"]{--g:var(--again)} .grade[data-g="1"]{--g:var(--hard)} .grade[data-g="2"]{--g:var(--good)}
.chip.star{cursor:pointer;color:var(--hard);letter-spacing:.05em;margin-left:auto;font-size:14px;padding:4px 10px;background:var(--surface)}
.done{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
.done .jp{font-size:30px}

/* Phrases */
.search{width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.filter{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filter button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:700;cursor:pointer;color:var(--muted)}
.filter button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.plist{display:flex;flex-direction:column;gap:8px}
.phrase{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 10px}
.phrase .jp{font-size:21px;line-height:1.7}
.phrase .rom{font-weight:700}
.phrase .en{color:var(--muted);font-size:15.5px}
.phrase .acts{grid-row:1 / span 3;grid-column:2;display:flex;flex-direction:column;gap:6px}
.group-h{font-size:15px;margin-top:8px;display:flex;align-items:center;gap:8px}

/* Progress & settings */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{font-family:var(--font-display);font-size:28px;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13.5px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--accent);margin-right:6px;vertical-align:0}
.legend i.light{opacity:.4}
.setting{display:flex;flex-direction:column;gap:8px;padding-block:14px;border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:0}
.setting h3{font-size:16px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-size:15px;font-weight:700;cursor:pointer;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
textarea{width:100%;min-height:90px;font:13px/1.4 ui-monospace,Menlo,monospace;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink)}
.msg{font-size:14px;font-weight:700;color:var(--good)}
.msg.err{color:var(--again)}
.howto{display:flex;flex-direction:column;gap:10px;font-size:15.5px}
.howto ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* Big show overlay */
.big{position:fixed;inset:0;z-index:20;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:24px 16px;cursor:pointer}
.big .jp{font-size:clamp(34px,11vw,72px);line-height:1.5}
.big .sub{font-size:20px;color:var(--muted)}
.big .close-hint{font-size:14px;color:var(--muted);position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px))}

/* Lesson + gamification */
.lesson-title{font-size:25px;margin-top:4px}
.lesson-title .jp{font-size:17px;color:var(--muted);font-weight:600;margin-left:4px}
.intro{gap:18px}
.gram{background:var(--surface-2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line)}
.gram-p{font-size:26px;color:var(--accent)}
.says{display:flex;flex-direction:column;gap:8px}
.say{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.say .jp{font-size:20px;line-height:1.7}
.say .rom{font-weight:700;font-size:15px}
.say .en{color:var(--muted);font-size:14.5px}
.wordchips{display:flex;flex-wrap:wrap;gap:6px}
.wchip{font-size:13.5px;border:1px solid var(--line);border-radius:10px;padding:3px 8px;background:var(--surface-2)}
.wchip .jp{font-size:15px}
.mission{gap:16px}
.mission-head{display:flex;gap:12px;align-items:center}
.big-hanko{width:52px;height:52px;font-size:30px}
.task{font-size:18px;font-weight:700;line-height:1.45}
.aya{border-left:3px solid var(--shu);background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:15.5px}
.won{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:8px 12px;font-size:15px}
.mission-mini{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:start;border:1.5px dashed var(--shu);border-radius:14px;padding:12px}
.mission-mini p{font-size:15px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-weight:700}
.wd i{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:14px;color:var(--muted)}
.wd i.did{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.wd i.les{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wd i.talk{background:var(--shu);border-color:var(--shu);color:#fff;font-family:var(--font-jp)}
.wd.is-today span{color:var(--ink)}
.lvl{display:flex;flex-direction:column;gap:6px}
.lvl-top{display:flex;justify-content:space-between;gap:8px;font-size:15px;flex-wrap:wrap}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-head .icon-btn{font-size:22px;line-height:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cw{font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.cd{aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--surface);border:1px solid var(--line);position:relative;display:flex;align-items:flex-start;justify-content:flex-start;padding:3px 5px;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
.cd.did{background:var(--accent-soft)}
.cd.les{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cd.is-today{outline:2px solid var(--ink);outline-offset:-2px}
.stamp{position:absolute;right:3px;bottom:3px;width:20px;height:20px;border-radius:5px;background:var(--shu);color:#fff;font-family:var(--font-jp);font-style:normal;font-size:13px;display:grid;place-items:center;transform:rotate(-6deg)}
.stamp-mini{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:4px;background:var(--shu);color:#fff;font-family:var(--font-jp);font-size:11px;margin-right:6px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;opacity:.5}
.badge.got{opacity:1;border-color:var(--hard)}
.badge > .jp{flex:none;min-width:40px;height:40px;padding-inline:4px;border-radius:50%;display:grid;place-items:center;font-size:17px;background:var(--surface-2);color:var(--muted)}
.badge.got > .jp{background:var(--hard);color:var(--surface)}
.badge b{font-size:14px}
.badge p{font-size:12.5px;color:var(--muted);line-height:1.3}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plan li{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.plan li.now{border:2px solid var(--accent)}
.plan li.done{opacity:.65}
.pn{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--surface-2);font-variant-numeric:tabular-nums}
.plan li.done .pn{background:var(--good);color:var(--surface)}
.plan li.now .pn{background:var(--accent);color:var(--accent-ink)}

.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;font-size:15px;box-shadow:var(--shadow)}
.grade .g-sub{font-size:12px;font-weight:400;color:var(--muted);line-height:1.2}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:380px){.ladder{grid-template-columns:repeat(2,1fr)}.step + .step::before{display:none}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <span class="hanko" aria-hidden="true">話</span>
      <div>
        <div class="wordmark">Hanasō<small>話そう</small></div>
        <div class="tagline">Japanese for family, strangers and Aya</div>
      </div>
    </div>
    <span class="pill" id="streakPill"></span>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="tabs-in">
    <button class="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="13" height="15" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v13"/></svg>Study</button>

  if (!audioLoading[b]) audioLoading[b] = fetch('audio/' + b + '.json').then(r => r.ok ? r.json() : {}).catch(() => ({})).then(d => (AUDIO[b] = d));
  return audioLoading[b];
}
function preloadFor(items) { new Set(items.map(bundleOf)).forEach(loadBundle); }
const player = new Audio();
const RATE_TO_SPEED = {0.65: 0.8, 0.85: 1, 1: 1.15};
function speak(it, fromUser = true) {
  const b = bundleOf(it), key = audioKey(it);
  const play = data => {
    try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
    player.pause();
    player.src = 'data:audio/mpeg;base64,' + data;
    player.playbackRate = RATE_TO_SPEED[S.settings.rate] || 1;
    player.play().catch(err => {
      if (!fromUser) return;
      if (err && err.name === 'NotAllowedError') toast('Tap Listen to play the sound.');
      else speakTTS(it, fromUser);
    });
  };
  if (AUDIO[b]) return AUDIO[b][key] ? play(AUDIO[b][key]) : speakTTS(it, fromUser);
  loadBundle(b).then(d => d[key] ? play(d[key]) : speakTTS(it, fromUser));
}
function speakTTS(it, fromUser = true) {
  const synth = window.speechSynthesis;
  if (!synth || typeof SpeechSynthesisUtterance === 'undefined') {
    if (fromUser) toast('This app window cannot read aloud. Open the link in Safari (iPhone) or Chrome (Android).');
    return;
  }
  try {
    if (!jaVoice) pickVoice();
    // Keep a reference: some browsers stop speaking if the utterance is garbage-collected.
    utter = new SpeechSynthesisUtterance(it.kanji.replace(/[…「」]/g, ''));
    utter.lang = 'ja-JP'; if (jaVoice) utter.voice = jaVoice; utter.rate = S.settings.rate;
    let started = false;
    utter.onstart = () => { started = true; };
    utter.onerror = e => {
      if (e.error === 'interrupted' || e.error === 'canceled') return;
      if (fromUser) toast(e.error === 'not-allowed' ? 'Tap Listen once to switch the voice on.' : 'The voice could not play (' + e.error + '). ' + (jaVoice ? '' : 'No Japanese voice found. ' + NO_VOICE_HELP));
    };
    const go = () => { synth.resume(); synth.speak(utter); };
    // Cancelling and speaking in the same moment is unreliable on iPhone and Chrome, so wait a little after a cancel.
    if (synth.speaking || synth.pending) { synth.cancel(); setTimeout(go, 120); } else go();
    clearTimeout(speakCheck);
    if (fromUser) speakCheck = setTimeout(() => {
      if (!started && !synth.speaking) toast(jaVoice ? 'No sound? Check the volume, and on iPhone the silent switch.' : 'No Japanese voice found on this device. ' + NO_VOICE_HELP);
    }, 2500);
  } catch (e) { if (fromUser) toast('The voice could not play on this device.'); }
}

  const el = document.getElementById('toast');
  el.textContent = msg; el.hidden = false;

}

function deckCounts(d) {
  let total = 0, seen = 0, strong = 0;
  DECK_ITEMS[d.id].forEach(it => dirsOf(it).forEach(dir => {
    total++; const st = S.cards[keyOf(it, dir)];
    if (st) { seen++; if (st.ivl >= 21) strong++; }
  }));
  return {total: total || 1, seen, strong, items: DECK_ITEMS[d.id].length};
}
function ladderCounts() {
  const c = [0, 0, 0, 0];
  DECKS.forEach(d => DECK_ITEMS[d.id].forEach(it => {
    const st = S.cards[keyOf(it, 'jp')] || S.cards[keyOf(it, 'en')]; if (!st) return;
    const ivl = st.ivl; c[ivl >= 60 ? 3 : ivl >= 21 ? 2 : ivl >= 7 ? 1 : 0]++;
  }));
  return c;
}

  document.getElementById('study').hidden = false;
  document.body.style.overflow = 'hidden';
  showCard();
}
function closeSession() {
  sess = null;
  try { speechSynthesis.cancel(); } catch (e) {}
  document.getElementById('study').hidden = true;
  document.body.style.overflow = '';
  render();
}
function jpBlock(it, lvl, big) {
  const len = it.kana.length;
  if (it.isKana) return `<div class="jp-main jp" style="font-size:96px;line-height:1.2">${esc(it.kana)}</div>`;
  const size = big ? (len <= 5 ? 50 : len <= 10 ? 38 : len <= 18 ? 30 : 25) : (len <= 10 ? 28 : 24);
  if (lvl === 0) return `<div class="jp-main rom" style="font-size:${Math.round(size * .8)}px">${esc(it.romaji)}</div><div class="jp-sub jp">${esc(it.kana)}</div>`;
  if (lvl === 1) return `<div class="jp-main jp" style="font-size:${size}px">${esc(it.kana)}</div><div class="jp-sub" data-peek="rom" hidden>${esc(it.romaji)}</div>`;
  if (lvl === 2 || !it.hasKanji) return `<div class="jp-main jp" style="font-size:${size}px">${it.ruby}</div>`;
  return `<div class="jp-main jp hide-rt" style="font-size:${size}px" data-peek="rt">${it.ruby}</div>`;
}
function peekButtons(it, lvl, noRom) {
  let b = `<button class="mini" data-act="speak" data-id="${esc(it.id)}">${ICON_SPEAK} Listen</button>`;
  if (!it.isKana && lvl === 1 && !noRom) b += `<button class="mini" data-act="peek" data-k="rom">Show romaji</button>`;
  if (!it.isKana && lvl === 3 && it.hasKanji) b += `<button class="mini" data-act="peek" data-k="rt">Show furigana</button>`;
  return `<div class="row-btns">${b}</div>`;
}
function showCard() {
  const box = document.getElementById('studyIn');
  const entry = sess.queue[sess.pos];
  const pct = Math.round(sess.pos / sess.queue.length * 100);
  const top = `<div class="study-top"><button class="icon-btn" data-act="close" aria-label="Stop studying">${ICON_CLOSE}</button><div class="prog"><i style="width:${pct}%"></i></div><span class="count">${sess.pos}/${sess.queue.length}</span></div>`;
  if (!entry) {
    sess.cur = null;
    if (sess.mode === 'lesson') return finishLesson();
    box.innerHTML = top + `<div class="done"><div class="jp">お疲れさまでした！</div><p style="font-size:19px"><b>Otsukaresama deshita!</b><br>Great work. You answered ${sess.answered} cards.</p>
      <div class="btn-row" style="width:100%"><button class="btn btn-soft" data-act="more">Learn 5 more</button><button class="btn btn-primary" data-act="close">Finish</button></div></div>`;
    return;
  }
  const {it, dir, k} = entry;
  const st = S.cards[k];
  const lvl = Math.max(levelFor(it), entry.forceLvl || 0);
  const noRom = !!entry.noRomaji;
  sess.cur = {it, lvl, dir, k, noRom, revealed: false};
  const chips = `<div class="chips"><span class="chip deckchip" style="--c:${it.deck.color}">${esc(it.deck.name)}</span>${st ? '' : '<span class="chip">new</span>'}${it.isKana ? '' : `<span class="chip">${dir === 'jp' ? 'understand' : 'speak'}</span><span class="chip">${LEVELS[lvl]}</span>`}${it.reg === 'polite' || it.reg === 'casual' ? `<span class="chip">${it.reg}</span>` : it.reg === 'read' ? '<span class="chip">sign / menu</span>' : ''}<button class="chip star" id="starBtn" data-act="prio" aria-label="Importance: tap to change">${PRIO_TEXT[prioOf(it)]}</button></div>`;
  let front;
  if (dir === 'jp') {
    front = `<div class="ask">${it.isKana ? 'How do you read this?' : noRom ? 'Again, without romaji. Can you read it?' : 'What does this mean?'}</div><div class="front">${jpBlock(it, lvl, true)}${peekButtons(it, lvl, noRom)}</div>`;
  } else {
    const ctx = it.reg === 'polite' || it.reg === 'casual' ? `${it.deck.who.toLowerCase()}, ${it.reg}` : it.deck.who.toLowerCase();
    front = `<div class="ask">How do you say this in Japanese? <span style="font-weight:400">(${esc(ctx)})</span></div>
      <div class="front"><div class="en-main" style="font-size:${it.en.length > 40 ? 24 : 30}px">${esc(it.en)}</div><div class="hint">Say it out loud first, then check.</div></div>`;
  }
  box.innerHTML = top + `<div class="card" id="card">${chips}${front}<div id="answer"></div></div>
    <div id="actions"><button class="btn btn-primary" data-act="reveal">Show answer</button></div>`;
  if (dir === 'jp' && S.settings.autoplay) speak(it, false);
}
function renderGrades() {
  const {it, k} = sess.cur;
  const st = S.cards[k] || blankState();
  document.getElementById('actions').innerHTML = `<div class="grades">${(it.isKana ? GRADES_KANA : GRADES).map((l, g) => `<button class="grade" data-act="grade" data-g="${g}">${l}<small>${fmtIvl(nextOf(st, g, it), g)}</small></button>`).join('')}</div>`;
}
function reveal() {
  const {it, lvl, dir, noRom} = sess.cur;
  if (sess.cur.revealed) return;
  sess.cur.revealed = true;
  const forms = it.isKana ? `<dl class="forms"><dt>Romaji</dt><dd><b>${esc(it.romaji)}</b></dd><dt>Hiragana</dt><dd class="jp">${esc(String.fromCharCode(it.kana.charCodeAt(0) - (it.deck.id === 'kata' ? 0x60 : 0)))}</dd><dt>Katakana</dt><dd class="jp">${esc(String.fromCharCode(it.kana.charCodeAt(0) + (it.deck.id === 'hira' ? 0x60 : 0)))}</dd></dl>`
    : `<dl class="forms">${noRom ? '' : `<dt>Romaji</dt><dd><b>${esc(it.romaji)}</b></dd>`}<dt>Kana</dt><dd class="jp">${esc(it.kana)}</dd>${it.hasKanji ? `<dt>Kanji</dt><dd class="jp">${it.ruby}</dd>` : ''}</dl>`;
  const head = dir === 'jp'
    ? `<div class="en-main" style="font-size:24px">${esc(it.isKana ? it.romaji : it.en)}</div>`
    : `<div class="front" style="min-height:0;padding:0">${jpBlock(it, lvl, true)}${peekButtons(it, lvl, noRom)}</div>`;
  document.getElementById('answer').innerHTML = `<div class="answer">${head}${forms}${it.note ? `<div class="note">${esc(it.note)}</div>` : ''}</div>`;
  renderGrades();
  if (dir === 'en' && S.settings.autoplay) speak(it, false);
}
function cyclePrio() {
  const it = sess.cur.it;
  const p = prioOf(it) === 1 ? 3 : prioOf(it) - 1;
  if (p === it.prio) delete S.prio[it.id]; else S.prio[it.id] = p;
  save();
  document.getElementById('starBtn').textContent = PRIO_TEXT[p];
  if (sess.cur.revealed) renderGrades();
}
function grade(g) {
  const {it, k} = sess.cur;
  freshDay();
  const t = today();
  const isNew = !S.cards[k];
  const st = S.cards[k] || blankState();
  const r = nextOf(st, g, it);
  st.ease = r.ease;
  if (r.writing) {
    // Next time (and from now on) this phrase is shown without romaji.
    const lvl = Math.max(sess.cur.lvl, 1);
    S.wlvl[it.id] = Math.max(S.wlvl[it.id] || 0, lvl);
    if (!S.cards[k]) { st.due = t; st.tried = true; }
    sess.queue.splice(Math.min(sess.queue.length, sess.pos + 5), 0, {...sess.queue[sess.pos], forceLvl: lvl, noRomaji: true});
  } else if (r.again) {
    if (r.lapsed) st.lapses++;
    st.ivl = r.ivl; st.due = t; st.lapsed = r.lapsed || st.lapsed; st.tried = true;
    sess.queue.splice(Math.min(sess.queue.length, sess.pos + (g === 0 ? 4 : 7)), 0, sess.queue[sess.pos]);
  } else {
    st.ivl = r.ivl; st.due = t + r.ivl; st.reps++; delete st.lapsed; delete st.tried;
  }
  S.cards[k] = st;
  if (isNew) S.day.newSeen++;
  S.day.reviews++; S.total++; S.xp++; logToday().n++;
  if (S.streak.last !== t) { S.streak.count = S.streak.last === t - 1 ? S.streak.count + 1 : 1; S.streak.last = t; S.streak.best = Math.max(S.streak.best || 0, S.streak.count); }
  save();
  sess.answered++;
  sess.pos++;
  showCard();
}

/* ============================================================
   DAILY LESSON FLOW: topic + grammar → cards → conversation mission
   ============================================================ */
function openStudy() { document.getElementById('study').hidden = false; document.body.style.overflow = 'hidden'; }
function sayRow(it) {
  return `<div class="say"><div><div class="jp">${it.ruby}</div><div class="rom">${esc(it.romaji)}</div><div class="en">${esc(it.en)}</div></div>
    <button class="icon-btn" data-act="speak" data-id="${esc(it.id)}" aria-label="Listen">${ICON_SPEAK}</button></div>`;
}
function startLesson() {
  const L = lessonFor(S.course.day);
  const q = lessonQueue(L);
  sess = {mode: 'lesson', L, queue: q, pos: 0, answered: 0, xp0: S.xp};
  preloadFor([...q.map(e => e.it), ...L.mission.sayItems, ...(L.g ? L.g.ex.map(([n]) => ITEMS['grammar|' + kanaText(parse(n))]) : [])]);
  openStudy();
  if (L.g || L.cards) showIntro(); else if (q.length) showCard(); else finishLesson();
}
function showIntro() {
  const {L, queue} = sess;
  const newCount = (L.cards || []).length;
  document.getElementById('studyIn').innerHTML = `
    <div class="study-top"><button class="icon-btn" data-act="close" aria-label="Close">${ICON_CLOSE}</button><div class="prog"><i style="width:0%"></i></div><span class="count">Day ${L.n}</span></div>
    <div class="card intro">
      <div><div class="eyebrow">Day ${L.n} · today's topic</div>
      <h1 class="lesson-title">${esc(L.t)} <span class="jp">${esc(L.jp)}</span></h1></div>
      ${L.g ? `<div class="gram">
        <div class="eyebrow">Grammar of the day</div>
        <div class="gram-p jp">${esc(L.g.p)}</div>
        <p>${esc(L.g.e)}</p>
        <div class="says">${L.g.ex.map(([n]) => sayRow(ITEMS['grammar|' + kanaText(parse(n))])).join('')}</div>
      </div>` : ''}
      ${newCount ? `<div><div class="eyebrow" style="margin-bottom:8px">New today · ${newCount}</div>
        <div class="wordchips">${L.cards.map(it => `<span class="wchip"><span class="jp">${it.ruby}</span> ${esc(it.en.length > 28 ? it.en.slice(0, 26) + '…' : it.en)}</span>`).join('')}</div></div>` : ''}
    </div>
    <div><button class="btn btn-primary" data-act="startcards">Start the cards · ${queue.length} cards · about ${minutesFor(queue, L) - (L.g ? 2 : 0) - 2} min</button></div>`;
}
function finishLesson() {
  const {L} = sess;
  const t = today();
  if (!sess.finished) {
    sess.finished = true;
    if (S.course.day === L.n) {
      S.course.day = L.n + 1; S.course.last = t; S.course.cur = null;
      S.course.pending = {n: L.n, deck: L.deck || null};
      S.xp += 20; logToday().l = L.n;
      save();
    }
  }
  showMission(L.mission, L.n, S.xp - sess.xp0);
}
function showMission(m, n, gained) {
  document.getElementById('studyIn').innerHTML = `
    <div class="study-top"><button class="icon-btn" data-act="close" aria-label="Close">${ICON_CLOSE}</button><div class="prog"><i style="width:100%"></i></div><span class="count">Day ${n}</span></div>
    <div class="card mission">
      ${gained != null ? `<div class="won"><span class="jp">お疲れさま！</span> Day ${n} done · <b>+${gained} XP</b></div>` : ''}
      <div class="mission-head"><span class="hanko big-hanko" aria-hidden="true">話</span><div><div class="eyebrow">Tonight's conversation</div><h2>Talk with Aya</h2></div></div>
      <p class="task">${esc(m.task)}</p>
      <div><div class="eyebrow" style="margin-bottom:6px">You can start with</div><div class="says">${m.sayItems.map(sayRow).join('')}</div></div>
      <div class="aya"><div class="eyebrow">Aya's part</div><p>${esc(m.aya)}</p></div>
    </div>
    <div class="btn-row"><button class="btn btn-line" data-act="close">Later</button><button class="btn btn-primary" data-act="talked" style="flex:2 1 180px">We talked! +30 XP</button></div>`;
}
function openMission() {
  const P = S.course.pending; if (!P) return;
  sess = {mode: 'mission', queue: [], pos: 0, answered: 0};
  openStudy();
  showMission(missionFor(P.n, P.deck), P.n, null);
}
function talked() {
  if (S.course.pending) {
    S.course.pending = null; S.talks++; S.xp += 30; logToday().t = true;
    const t = today();
    if (S.streak.last !== t) { S.streak.count = S.streak.last === t - 1 ? S.streak.count + 1 : 1; S.streak.last = t; S.streak.best = Math.max(S.streak.best || 0, S.streak.count); }
    save();
  }
  closeSession();
}

/* ============================================================
   BIG DISPLAY (show a phrase to someone)
   ============================================================ */
function showBig(it) {
  const b = document.getElementById('big');
  b.innerHTML = `<div class="jp">${it.ruby}</div><div class="sub">${esc(it.romaji)}</div><div class="sub">${esc(it.en)}</div><div class="close-hint">Tap anywhere to close</div>`;
  b.hidden = false;
  speak(it);
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click', e => {
  const tb = e.target.closest('.tab');
  if (tb) { tab = tb.dataset.tab; resetArmed = false; backupMsg = ''; try { localStorage.setItem(KEY + '.tab', tab); } catch (er) {} render(); window.scrollTo(0, 0); return; }
  if (e.target.closest('#big')) { document.getElementById('big').hidden = true; return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'start') startSession();
  else if (act === 'lesson') startLesson();
  else if (act === 'startcards') { if (sess.queue.length) showCard(); else finishLesson(); }
  else if (act === 'talked') talked();
  else if (act === 'mission') openMission();
  else if (act === 'cal') { calOff += +el.dataset.d; render(); }
  else if (act === 'more') { if (sess) { const q = buildQueue(5); if (q.length) { sess = {queue: q, pos: 0, answered: sess.answered}; showCard(); } } else startSession(5); }
  else if (act === 'close') closeSession();
  else if (act === 'reveal') reveal();
  else if (act === 'grade') grade(+el.dataset.g);
  else if (act === 'prio') cyclePrio();
  else if (act === 'speak') speak(ITEMS[el.dataset.id]);
  else if (act === 'big') showBig(ITEMS[el.dataset.id]);
  else if (act === 'peek') {
    const k = el.dataset.k;
    document.querySelectorAll(`[data-peek="${k}"]`).forEach(n => { if (k === 'rom') n.hidden = !n.hidden; else n.classList.toggle('hide-rt'); });
  }
  else if (act === 'pdeck') { phraseDeck = el.dataset.id; render(); }
  else if (act === 'set') {
    let v = el.dataset.v; const k = el.dataset.k;
    if (k === 'newPerDay' || k === 'rate') v = +v;
    else if (k === 'autoplay') v = v === 'true';
    S.settings[k] = v; save(); render();
  }
  else if (act === 'testvoice') speak(ITEMS['basics|こんにちは。']);
  else if (act === 'backup') {
    const code = JSON.stringify(S);
    const box = document.getElementById('restoreBox');
    const done = ok => { backupMsg = ok ? 'Backup code copied. Paste it somewhere safe.' : 'Copy did not work. The code is in the box below: select it and copy it.'; render(); if (!ok) { const b2 = document.getElementById('restoreBox'); b2.value = code; b2.select(); } };
    try { navigator.clipboard.writeText(code).then(() => done(true), () => done(false)); } catch (er) { done(false); }
  }
  else if (act === 'restore') {
    const txt = document.getElementById('restoreBox').value.trim();
    try {
      const s = JSON.parse(txt);
      if (!s || typeof s.cards !== 'object') throw new Error();
      S = fromSaved(s); save(); backupMsg = 'Progress restored.';
    } catch (er) { backupMsg = '!This code could not be read. Check that you pasted the whole code.'; }
    render();
  }
  else if (act === 'reset') {
    if (!resetArmed) { resetArmed = true; render(); return; }
    const keep = S.settings; S = blankSave(); S.settings = keep;
    save(); resetArmed = false; render();
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.act === 'deck') { S.settings.decks[el.dataset.id] = el.checked; save(); render(); }
});
document.addEventListener('keydown', e => {
  if (!sess || !sess.cur || document.getElementById('study').hidden) return;
  if (e.key === 'Escape') return closeSession();
  if (!sess.cur.revealed && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); reveal(); }
  else if (sess.cur.revealed && ['1', '2', '3'].includes(e.key)) grade(+e.key - 1);
});

render();
loadBundle('basics'); loadBundle('say');
</script>
