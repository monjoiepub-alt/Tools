<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retki Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --surface-2:#E2E9E5; --ink:#16262B; --ink-2:#4A5C61; --line:#C6D1CC;
  --accent:#1B5D78; --accent-ink:#FFFFFF; --accent-soft:#D4E6EE;
  --trail:#D5621C;
  --ok:#2A7549; --ok-soft:#DAEEE1; --warn:#8C5A00; --warn-soft:#F6EACB; --bad:#AE3527; --bad-soft:#F6DCD7;
  --focus:#D5621C;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E181B; --surface:#152328; --surface-2:#1C2E34; --ink:#E2EBE9; --ink-2:#A2B3B2; --line:#2D4148;
    --accent:#6CB3D0; --accent-ink:#0A1A20; --accent-soft:#1D3945;
    --trail:#F08B47;
    --ok:#6CC08C; --ok-soft:#163225; --warn:#E2B04E; --warn-soft:#382C12; --bad:#F08676; --bad-soft:#3D1E1A;
    --focus:#F08B47;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E181B; --surface:#152328; --surface-2:#1C2E34; --ink:#E2EBE9; --ink-2:#A2B3B2; --line:#2D4148;
  --accent:#6CB3D0; --accent-ink:#0A1A20; --accent-soft:#1D3945;
  --trail:#F08B47;
  --ok:#6CC08C; --ok-soft:#163225; --warn:#E2B04E; --warn-soft:#382C12; --bad:#F08676; --bad-soft:#3D1E1A;
  --focus:#F08B47;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--body);letter-spacing:.005em}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 72px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0;letter-spacing:.01em}
h2{font-size:1.85rem}
h3{font-size:1.35rem}
p{margin:0}
a{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:0}
.mark{font-family:var(--display);font-weight:700;font-size:2.1rem;letter-spacing:.1em;display:inline-flex;align-items:center;gap:12px;line-height:1}
.mark::before{content:"";width:12px;height:24px;background:var(--trail);border-radius:2px}
.brand-sub{font-size:.9rem;color:var(--ink-2);padding-left:24px}
.tripbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tripbar select{width:auto;max-width:100%;min-width:0;flex:1 1 220px}

/* buttons & inputs */
button{font:600 1rem/1.2 var(--body);min-height:44px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent}
button.danger{color:var(--bad);border-color:var(--bad)}
button.icon{min-width:44px;padding:8px 10px}
button.small{min-height:36px;padding:6px 12px;font-size:.92rem}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
input,select,textarea{font:inherit;font-size:1rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:44px;width:100%}
input::placeholder,textarea::placeholder{color:var(--ink-2);opacity:.75}
textarea{min-height:88px;resize:vertical;line-height:1.5}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--accent);flex:none;margin:0}

/* summary */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px;margin-block:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.stat .k{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:.85rem;color:var(--ink-2)}
.stat .v{font-family:var(--mono);font-size:1.3rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}
.stat .s{font-size:.82rem;color:var(--ink-2)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:2px;overflow-x:auto;border-bottom:2px solid var(--line);scrollbar-width:thin}
.tab{border:0;background:transparent;border-bottom:3px solid transparent;border-radius:0;margin-bottom:-2px;white-space:nowrap;color:var(--ink-2);font-family:var(--display);font-weight:600;font-size:1.15rem;letter-spacing:.03em;padding:10px 12px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--trail)}

/* panels */
.panel{display:grid;gap:20px;margin-top:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:14px;min-width:0}
.card-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.intro{max-width:68ch;color:var(--ink-2)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 18px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
.lbl{font-weight:600;font-size:.95rem}
.help{font-size:.85rem;color:var(--ink-2)}
.chk{display:flex;gap:10px;align-items:center;min-height:44px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:8px 16px 8px 12px;background:var(--surface);cursor:pointer}
.chip:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px}
.steps{margin:0;padding-left:1.4em;display:grid;gap:6px;max-width:68ch}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-size:.85rem;color:var(--ink-2);text-align:left;padding:8px 10px;background:var(--surface-2);white-space:nowrap}
td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:middle}
td input,td select{min-width:72px}
td textarea{min-height:64px;min-width:220px}
.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.w-xs input{min-width:64px;width:72px}
.w-s input,.w-s select{min-width:96px}
.w-m input,.w-m select{min-width:150px}
.w-l input,.w-l textarea{min-width:220px}
tr.is-done td{background:var(--ok-soft)}
tr.sub td{background:var(--surface-2);font-weight:600}
.muted{color:var(--ink-2)}
.center{text-align:center}

/* state */
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.85rem;font-weight:600;white-space:nowrap;line-height:1.5}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.note{border-radius:8px;padding:12px 14px;background:var(--surface-2);max-width:none}
.note.warn{background:var(--warn-soft)}
.note.bad{background:var(--bad-soft)}
.note.info{background:var(--accent-soft)}
.banner{border:2px dashed var(--accent);background:var(--accent-soft);border-radius:10px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-top:16px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bad-soft);border-radius:8px;padding:10px 12px;width:100%}

/* totals & figures */
.totals{display:grid;gap:2px;max-width:460px}
.totals div{display:flex;justify-content:space-between;gap:16px;padding:6px 0;border-bottom:1px solid var(--line)}
.totals div:last-child{border-bottom:0}
.totals .big{font-size:1.15rem;font-weight:700}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.fig{border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--surface)}
.fig .k{font-size:.88rem;color:var(--ink-2)}
.fig .v{font-family:var(--mono);font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;min-width:80px}
.bar span{display:block;height:100%;background:var(--accent)}

/* checklists */
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.checklist li{display:flex;gap:12px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line)}
.checklist li.is-done{color:var(--ink-2)}
.checklist li.is-done .t{text-decoration:line-through}
.checklist .q{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* carriers */
.carriers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.carrier{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;align-content:start}
.carrier-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.carrier ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.92rem}
.carrier li{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
.carrier li select{min-height:36px;padding:4px 6px;font-size:.88rem;width:auto;max-width:140px}

.out{font-family:var(--mono);font-size:.85rem;min-height:220px;white-space:pre}
.msg{font-weight:600}
@media (max-width:560px){
  body{font-size:16px}
  h2{font-size:1.6rem}
  .mark{font-size:1.8rem}
}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
'use strict';

/* ---------- reference data ---------- */
const ACT={
  hiking:{label:'Hiking / trekking',pace:3.5,kcal:3000,foot:true},
  canoe:{label:'Canoe',pace:4,kcal:3000},

const WATER=['canoe','kayak','packraft','sup'];
const SNOW=['ski','snowshoe','pulk'];
const UNITS=[['group','per group (once)'],['person','per person (everyone)'],['participant','per participant'],['personDay','per person per day'],['day','per day']];
const CATS=['Transport','Accommodation','Food','Gear rental','Permits & fees','Staff','Insurance','Other'];
const CURRENCIES=['EUR','SEK','NOK','USD','GBP','CHF','JPY','TWD'];
const TYPES=[['personal','Personal (each person)'],['group','Group (shared)'],['transport','Boat / bike / worn (not in pack)']];

// name | type p/g/t | grams | quantity rule (number, n = everyone, n/3 = one per 3 people)
const GEAR={
  base:[
    'Backpack (60–80 L)|p|1800','Sleeping bag (comfort rating fits the forecast)|p|1400','Sleeping pad|p|500',
    'Headlamp + spare batteries|p|120','Base layers, top and bottom (wool or synthetic)|p|350','Warm mid layer (fleece or wool)|p|450',
    'Rain jacket|p|400','Rain trousers|p|300','Warm hat and gloves|p|180','Spare socks and underwear|p|250',
    'Dry camp clothes in a dry bag|p|600','Water bottle (1 L)|p|150','Mug, bowl and spoon (a kuksa works)|p|200','Knife|p|100',
    'Personal medication and small first aid kit|p|150','Sunscreen, lip balm, sunglasses|p|150','Toiletries, toothbrush, toilet paper|p|250',
    'Phone in waterproof case|p|250','Sit pad|p|80','Whistle|p|15',
    'Tent|g|2800|n/3','Stove|g|400|n/5','Cook pot set|g|800|n/5','Lighter and fire steel|g|80|2',
    'Water filter or purification tablets|g|300|n/5','Group first aid kit (see Safety tab)|g|900|1',
    'Repair kit (duct tape, cord, needle, spare buckles)|g|400|1','Map and compass|g|250|2','Emergency shelter (bothy bag)|g|600|n/6',
    'Power bank|g|350|n/4','Satellite messenger or PLB|g|150|1','Tarp|g|900|1','Saw or axe|g|700|1',
    'Toilet trowel and bags|g|150|1','Rubbish bags|g|100|1'
  ],
  summer:['Mosquito head net and repellent|p|120','Sun hat|p|80','Tick remover|g|20|2'],
  cold:['Insulated jacket (down or synthetic)|p|800','Mittens with liner gloves|p|250','Face protection (buff, balaclava)|p|80',
    'Thermos (vacuum flask)|p|450','Camp booties|p|250','Extra closed-cell foam pad|p|300','Low-reading thermometer|g|50|1','Spare hand warmers|g|200|1'],
  hiking:['Hiking poles|p|500','Gaiters|p|300'],
  canoe:['Canoe|t|30000|n/2','Paddle|t|900|n','Spare paddle|t|900|n/2','Buoyancy aid (PFD)|t|700|n','Dry bags or barrel|p|400',
    'Water shoes|p|400','Bailer and sponge|t|200|n/2','Painter lines (bow and stern)|t|400|n/2','Throw bag|g|800|n/4','Canoe repair kit|g|500|1','Waterproof map case|g|150|1'],
  kayak:['Sea kayak|t|25000|n','Paddle|t|900|n','Spray deck|t|500|n','Buoyancy aid (PFD)|t|700|n','Wetsuit or drysuit|p|1500',
    'Paddling shoes|p|400','Bilge pump|t|500|n','Paddle float|t|400|n/2','Spare split paddle|t|1000|n/3','Towline|g|600|n/3',
    'VHF radio|g|300|1','Kayak repair kit|g|500|1','Dry bags or barrel|p|400'],
  packraft:['Packraft|p|3000','Four-piece paddle|p|1000','Buoyancy aid (PFD)|p|700','Helmet|p|400','Inflation bag|p|60','Drysuit|p|1300',
    'Throw bag|g|800|n/4','Packraft repair patches|g|150|1'],
  sup:['SUP board|t|11000|n','SUP paddle|t|800|n','Leash|t|200|n','Buoyancy aid (PFD)|t|700|n','Board pump|g|1200|n/4','Dry bags or barrel|p|400'],
  bike:['Bike|t|14000|n','Helmet|p|350','Bike bags (frame, seat, handlebar)|p|1200','Lights front and rear|p|250','Spare inner tube|p|200',
    'Multitool and tyre levers|g|250|n/3','Bike pump|g|200|n/3','Chain lube and rag|g|150|1','Spare brake pads and chain links|g|150|1'],
  climb:['Helmet|p|350','Harness|p|400','Climbing shoes|p|500','Belay device and locking carabiner|p|150','Chalk bag|p|100',
    'Rope|g|3800|n/3','Quickdraws (set of 12)|g|1200|n/3','Slings and cord for anchors|g|800|n/3','Guidebook or topo|g|300|1'],
  ski:['Skis and bindings|t|3000|n','Ski boots|t|1500|n','Ski poles|t|500|n','Climbing skins|p|500','Goggles|p|200','Wax kit|g|500|1',
    'Binding and pole repair kit|g|400|1','Avalanche kit: transceiver, probe, shovel (mountain terrain only)|p|1300'],
  snowshoe:['Snowshoes|t|2000|n','Ski poles|t|500|n','Gaiters|p|300','Goggles|p|200'],
  pulk:['Pulk sled with harness|t|6000|n','Winter sleeping bag (−25 °C comfort)|p|2200','Snow shovel|g|700|n/4','Snow saw|g|400|1',
    'Big pot for melting snow|g|900|n/5','Candle lantern|g|200|n/3'],
  skate:['Nordic tour skates|p|1600','Ice claws (worn around the neck)|p|150','Throw rope in a bag|p|500','Ice pole (ice prod)|p|600',
    'Helmet|p|350','Spare dry clothes in a dry bag|p|800']
};

// hazard | likelihood | severity | how we reduce it
const RISKS={
  base:[
    'Getting lost or separated from the group|2|2|Route briefing every morning, map and compass in each small group, buddy system, agreed regroup points.',
    'Slip, trip or sprain on uneven ground|2|2|WFA-trained leader, group first aid kit, sensible pace, good footwear.',
    'Sudden weather change (storm, heavy rain)|2|3|Check the forecast (FMI / Ilmatieteen laitos) every day, set a turn-around time, have a plan B campsite.',

    'Stomach illness from food or water|1|2|Filter or boil water, wash hands before cooking, store food safely (hygiene passport rules).',
    'Medical condition or allergy in the group|1|3|Collect health forms before the trip, know where EpiPens and medicines are kept, brief the co-leader.',
    'No phone signal in an emergency|2|3|Check coverage maps, carry a satellite messenger, leave the route plan and check-in times with a contact person.',
    'Campfire or stove fire|1|3|Follow forest fire warnings (open fire is banned during a warning in Finland), use marked fire sites only, keep water ready.'
  ],
  water:[
    'Capsize and cold-water immersion|2|3|PFD worn at all times, capsize and rescue practice on day 1, stay near the shore when the water is cold, spare clothes in a dry bag.',

    'Drowning|1|3|Know everyone’s swimming ability, PFD always on, throw bag ready, leaders trained in water rescue.'
  ],
  rapids:['Rapids, weirs or strong current|1|3|Scout from the shore, portage when in doubt, know the river grade.'],
  winter:[
    'Frostbite|2|2|Buddy face checks, mittens and face protection, keep feet warm and dry, stop and rewarm early.',
    'Falling through lake or river ice|1|3|Ice claws worn, check ice thickness, avoid currents, river mouths and reeds, keep distance between people.',
    'Short daylight and darkness (kaamos)|2|2|Plan days around daylight, headlamps with spare batteries, set up camp before dark.',
    'Snow blindness|1|2|Sunglasses or goggles in bright snow.'
  ],
  avalanche:['Avalanche (mountain terrain only)|1|3|Check the avalanche forecast, full avalanche kit and training for everyone, avoid slopes steeper than 30°.'],
  skate:[

  ],
  climb:[

    'Rockfall|1|3|Helmets, no standing under climbers, choose solid rock.'
  ],
  bike:[
    'Traffic collision|1|3|Helmets, lights and reflective vests, ride in single file on roads, avoid busy roads.',

  ],
  summer:[

    'Wasp sting with allergic reaction|1|3|Know who has allergies, all leaders know where the EpiPen is, antihistamines in the kit.'
  ]
};

const EMERGENCY={
  FI:{name:'Finland',lines:[['112','All emergencies (ambulance, fire, police, sea rescue)'],['112 Suomi app','Sends your exact location to the emergency centre'],['+358 294 1000','Maritime rescue (MRCC Turku)'],['0800 147 111','Poison Information Centre']]},
  SE:{name:'Sweden',lines:[['112','All emergencies'],['1177','Health advice (non-urgent)']]},

  TW:{name:'Taiwan',lines:[['119','Ambulance and fire'],['110','Police'],['118','Coast guard']]}
};

const TASKS=[
  [90,'before','Choose area and dates. Check permits and national park rules.'],
  [60,'before','Make the budget and set the price (Costs tab).'],
  [56,'before','Book huts, campsites and transport.'],
  [49,'before','Send the info letter. Collect health, diet and swimming forms.'],
  [42,'before','Book or rent gear (boats, pulks, skis…).'],
  [28,'before','Finish the risk assessment and emergency plan (Safety tab).'],
  [21,'before','Check group gear and repair what is broken.'],
  [14,'before','Make the meal plan and shopping list (Food tab).'],
  [10,'before','Leave the route plan and check-in times with the contact person at home.'],
  [7,'before','Check the long-range forecast, ice or water conditions and forest fire warnings.'],
  [3,'before','Food shopping and repacking into daily bags.'],
  [2,'before','Pack and share out group gear. Charge all batteries.'],
  [1,'before','Final forecast check. Gear check with the group.'],
  [0,'after-start','Departure: head count and safety briefing.'],
  [0,'after-end','Tell the contact person you are back safely.'],

  [14,'after-end','Final accounting: receipts against the budget.']

/* ---------- helpers ---------- */
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function num(v){const n=parseFloat(String(v??'').replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0;}
const r1=n=>Math.round(n*10)/10;
const kg=g=>r1(g/1000).toLocaleString('en-GB')+' kg';
function money(v,cur){
  const whole=cur==='JPY'||cur==='TWD';
  try{return new Intl.NumberFormat('en-IE',{style:'currency',currency:cur,minimumFractionDigits:whole?0:2,maximumFractionDigits:whole?0:2}).format(v||0);}
  catch(e){return (v||0).toFixed(whole?0:2)+' '+cur;}
}
function parseDate(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null;}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function nice(d){return d?d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'}):'';}
function today(){const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());}
function qtyFor(rule,n){
  if(rule==='n')return Math.max(1,n);
  const m=/^n\/(\d+)$/.exec(rule);
  if(m)return Math.max(1,Math.ceil(n/+m[1]));
  return Math.max(1,parseInt(rule,10)||1);
}

function getPath(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o);}
function setPath(o,p,v){const ks=p.split('.');const last=ks.pop();const tgt=ks.reduce((a,k)=>a[k],o);tgt[last]=v;}

/* ---------- suggestions ---------- */
function peopleCount(t){return Math.max(0,num(t.participants))+Math.max(0,num(t.leaders));}
function coldTemp(t){return String(t.minTemp).trim()===''?(t.season==='winter'?-10:t.season==='summer'?10:3):num(t.minTemp);}
function isCold(t){return coldTemp(t)<0||t.season==='winter';}
function suggestGear(t){
  const n=peopleCount(t)||1;
  const keys=['base',...t.activities];
  if(t.season==='summer')keys.push('summer');
  if(isCold(t))keys.push('cold');
  const have=new Set(t.gear.map(g=>g.name.trim().toLowerCase()));
  let added=0;
  keys.forEach(k=>(GEAR[k]||[]).forEach(s=>{
    const [name,ty,g,rule]=s.split('|');
    if(have.has(name.toLowerCase()))return;
    have.add(name.toLowerCase());
    const type={p:'personal',g:'group',t:'transport'}[ty];
    t.gear.push({id:uid(),name,type,grams:g,qty:String(type==='personal'?1:qtyFor(rule||'1',n)),packed:false});
    added++;
  }));
  return added;
}
function suggestRisks(t){
  const a=t.activities,keys=['base'];
  if(a.some(x=>WATER.includes(x)))keys.push('water');
  if(a.includes('canoe')||a.includes('packraft'))keys.push('rapids');
  if(a.some(x=>SNOW.includes(x))||a.includes('skate')||isCold(t))keys.push('winter');
  if(a.includes('ski'))keys.push('avalanche');
  if(a.includes('skate'))keys.push('skate');
  if(a.includes('climb'))keys.push('climb');
  if(a.includes('bike'))keys.push('bike');
  if(t.season==='summer')keys.push('summer');
  const have=new Set(t.risks.map(r=>r.hazard.trim().toLowerCase()));
  let added=0;
  keys.forEach(k=>RISKS[k].forEach(s=>{
    const [hazard,l,sv,fix]=s.split('|');
    if(have.has(hazard.toLowerCase()))return;
    have.add(hazard.toLowerCase());
    t.risks.push({id:uid(),hazard,l,s:sv,fix,who:''});added++;
  }));
  return added;
}

/* ---------- calculations ---------- */
function calc(t){
  const days=Math.max(0,num(t.days)),part=Math.max(0,num(t.participants)),lead=Math.max(0,num(t.leaders)),people=part+lead;
  const acts=t.activities.length?t.activities:['hiking'];
  const minT=coldTemp(t);
  let kcal=Math.max(...acts.map(a=>ACT[a].kcal));
  if(minT<0)kcal+=Math.min(800,Math.round(-minT*25/50)*50);
  if(num(t.food.kcalOverride)>0)kcal=num(t.food.kcalOverride);
  const foodDays=days+(t.food.spareDay?1:0);
  const kgPPD=Math.round(kcal/4200*100)/100;
  const foodKg=kgPPD*foodDays*people;
  const foodCost=num(t.food.costPPD)*foodDays*people;
  const gasPPD=t.food.meltSnow?90:minT<-5?45:minT<5?35:25;
  const fuelG=gasPPD*days*people;
  const mult={group:1,person:people,participant:part,personDay:people*days,day:days};
  const rows=t.costs.map(c=>({c,total:num(c.amount)*num(c.qty)*(mult[c.unit]??1)}));
  const byCat={};
  rows.forEach(r=>{byCat[r.c.cat]=(byCat[r.c.cat]||0)+r.total;});
  if(t.food.includeInCosts)byCat.Food=(byCat.Food||0)+foodCost;
  const subtotal=rows.reduce((a,r)=>a+r.total,0)+(t.food.includeInCosts?foodCost:0);
  const buffer=subtotal*num(t.buffer)/100;
  const total=subtotal+buffer;
  const perPart=part?total/part:0,perPerson=people?total/people:0;
  const price=perPart*(1+num(t.margin)/100);
  let personalG=0,groupG=0;
  t.gear.forEach(g=>{const w=num(g.grams)*num(g.qty);if(g.type==='personal')personalG+=w;else if(g.type==='group')groupG+=w;});
  const pace=num(t.pace)||ACT[acts[0]].pace;
  const foot=ACT[acts[0]].foot;
  return {days,part,lead,people,acts,minT,kcal,foodDays,kgPPD,foodKg,foodCost,gasPPD,fuelG,rows,byCat,subtotal,buffer,total,perPart,perPerson,price,personalG,groupG,pace,foot};
}
function loads(t,c){
  const eachFood=c.people?(c.foodKg*1000+c.fuelG)/c.people:0;
  const base=c.personalG+eachFood;
  const units=[];
  t.gear.filter(g=>g.type==='group').forEach(g=>{
    const q=Math.max(0,Math.round(num(g.qty)));
    for(let i=0;i<q;i++)units.push({key:g.id+':'+i,name:g.name+(q>1?' ('+(i+1)+'/'+q+')':''),g:num(g.grams)});
  });
  const map={};
  t.people.forEach(p=>{map[p.id]={p,items:[],g:base};});
  const unassigned=[];
  units.forEach(u=>{const pid=t.assign[u.key];if(pid&&map[pid]){map[pid].items.push(u);map[pid].g+=u.g;}else unassigned.push(u);});
  return {rows:t.people.map(p=>map[p.id]),unassigned,base,eachFood,units};
}
function shareOut(t){
  const c=calc(t),L=loads(t,c);
  if(!L.rows.length)return false;
  t.assign={};
  const bins=L.rows.map(r=>({id:r.p.id,g:L.base}));
  L.units.slice().sort((a,b)=>b.g-a.g).forEach(u=>{bins.sort((a,b)=>a.g-b.g);bins[0].g+=u.g;t.assign[u.key]=bins[0].id;});
  return true;
}
function routeHours(r,c){
  if(String(r.hours).trim()!=='')return num(r.hours);
  const h=num(r.km)/c.pace+(c.foot?num(r.up)/600:0);
  return Math.round(h*2)/2;
}
function taskDate(t,k,start){
  start=start||parseDate(t.start);if(!start)return null;
  const n=num(k.n),days=Math.max(1,num(t.days));
  if(k.rel==='before')return addDays(start,-n);
  if(k.rel==='after-start')return addDays(start,n);
  return addDays(start,days-1+n);
}
function firstAidList(t,c){
  const n=Math.max(1,c.people),d=Math.max(1,c.days);
  const L=[
    ['gloves','Nitrile gloves (pairs)',Math.max(6,n)],
    ['plasters','Plasters, mixed sizes',20+2*n],
    ['blister','Blister kit (blister plasters, moleskin)',Math.ceil(n/4)],
    ['gauze','Sterile gauze pads 10 × 10 cm',10+2*d],
    ['strips','Wound closure strips (packs)',1],
    ['tape','Athletic tape 3.8 cm (rolls)',2],
    ['elastic','Elastic bandage',2],
    ['splint','SAM splint',n>10?2:1],
    ['triangle','Triangular bandage',2],
    ['shears','Trauma shears',1],
    ['tweezers','Tweezers and tick remover',1],
    ['syringe','Irrigation syringe',1],
    ['wipes','Antiseptic wipes',10+n],
    ['pain','Pain relief (paracetamol, ibuprofen)',1],
    ['antihist','Antihistamine tablets (packs)',1],
    ['ors','Oral rehydration salts (sachets)',Math.max(6,n)],
    ['blanket','Emergency (space) blanket',Math.ceil(n/4)+1],
    ['cpr','CPR pocket mask',1],
    ['sanitiser','Hand sanitiser',1],
    ['soap','Pencil, notebook and SOAP note forms',1]
  ];
  if(isCold(t))L.push(['thermo','Low-reading thermometer (hypothermia)',1]);
  if(t.activities.some(a=>WATER.includes(a)))L.push(['drybag','Waterproof bag for the kit',1]);
  return L.map(([key,name,qty])=>({key,name,qty}));
}

function inp(path,label,o={}){

    <input id="${idOf(path)}" type="${o.type||'text'}"${o.mode?` inputmode="${o.mode}"`:''} data-path="${path}" value="${esc(v)}" placeholder="${esc(o.ph||'')}" autocomplete="off">
    ${o.help?`<span class="help">${o.help}</span>`:''}</label>`;
}
function sel(path,label,opts,o={}){
  const v=getPath(T(),path);
  return `<label class="fld${o.wide?' wide':''}" for="${idOf(path)}"><span class="lbl">${label}</span>
    <select id="${idOf(path)}" data-path="${path}">${opts.map(([k,t])=>`<option value="${esc(k)}"${String(v)===String(k)?' selected':''}>${esc(t)}</option>`).join('')}</select>

}
function area(path,label,o={}){

function chk(path,label){

function rin(list,row,f,o={}){

function rarea(list,row,f,o={}){

function rsel(list,row,f,opts,o={}){

}
function rchk(list,row,f,aria){
  return `<input type="checkbox" id="r-${list}-${row.id}-${f}" data-list="${list}" data-id="${row.id}" data-f="${f}"${row[f]?' checked':''} aria-label="${esc(aria)}">`;
}
const del=(list,id,what)=>`<button class="icon ghost small" data-act="del-row" data-list="${list}" data-id="${id}" aria-label="Delete ${esc(what)}" title="Delete">✕</button>`;
function riskPill(l,s){const x=num(l)*num(s);return x>=6?`<span class="pill bad">High · ${x}</span>`:x>=3?`<span class="pill warn">Medium · ${x}</span>`:`<span class="pill ok">Low · ${x}</span>`;}
function loadPill(g,pulk){const k=g/1000;const lim=pulk?[30,40]:[18,23];return k>lim[1]?`<span class="pill bad">${kg(g)}</span>`:k>lim[0]?`<span class="pill warn">${kg(g)}</span>`:`<span class="pill ok">${kg(g)}</span>`;}

function pCosts(){

    <h2>Costs</h2>

      ${sel('currency','Currency',CURRENCIES.map(x=>[x,x]))}
      ${sel('altCurrency','Also show in',CURRENCIES.map(x=>[x,x]))}
      ${inp('altRate',`1 ${esc(cur)} = ? ${esc(t.altCurrency)}`,{mode:'decimal',help:'Exchange rates change. Update this before you use it.'})}
      ${inp('buffer','Safety buffer (%)',{mode:'decimal',help:'For surprises. 10–15% is common.'})}
      ${inp('margin','Margin for client price (%)',{mode:'decimal',help:'Use 0 for a school or club trip at cost.'})}
    </div>
  </section>
  <section class="card">
    <div class="card-head"><h3>Cost rows</h3><button class="primary" data-act="add-cost">Add cost</button></div>

      <thead><tr><th>What</th><th>Category</th><th class="num">Price</th><th class="num">Qty</th><th>Counts</th><th class="num">Total</th><th></th></tr></thead>

        <td class="w-l">${rin('costs',r,'label',{aria:'What'})}</td>
        <td class="w-m">${rsel('costs',r,'cat',CATS.map(x=>[x,x]),{aria:'Category'})}</td>

        <div><span>Per person, everyone (${c.people})</span><span class="num">${money(c.perPerson,cur)}</span></div>
        <div><span>Cost per participant (${c.part})</span><span class="num">${money(c.perPart,cur)}</span></div>

function pTimeline(){
  const t=T(),start=parseDate(t.start),now=today();
  const rows=t.tasks.map(k=>({k,d:taskDate(t,k,start)}));
  rows.sort((a,b)=>(a.d&&b.d)?a.d-b.d:0);
  const done=t.tasks.filter(k=>k.done).length;
  function status(k,d){
    if(k.done)return '<span class="pill ok">Done</span>';
    if(!d)return '<span class="pill info">No date</span>';
    const diff=Math.round((d-now)/864e5);
    if(diff<0)return `<span class="pill bad">Late by ${-diff} d</span>`;
    if(diff===0)return '<span class="pill warn">Today</span>';
    if(diff<=7)return `<span class="pill warn">In ${diff} d</span>`;
    return `<span class="pill info">In ${diff} d</span>`;
  }
  return `
  <section class="card">
    <div class="card-head"><h2>Timeline <span class="pill ${done===t.tasks.length?'ok':'info'}">${done} / ${t.tasks.length}</span></h2><button class="primary" data-act="add-task">Add task</button></div>
    <p class="intro">Each task has a date counted from the trip start or end. Late tasks turn red.</p>
    ${start?'':'<p class="note warn">Add a start date in the Trip tab to see real dates.</p>'}
    <div class="tablewrap"><table>
      <thead><tr><th class="center">Done</th><th>Task</th><th class="num">Days</th><th>When</th><th>Date</th><th>Status</th><th></th></tr></thead>
      <tbody>${rows.map(({k,d})=>`<tr class="${k.done?'is-done':''}">
        <td class="center">${rchk('tasks',k,'done','Done: '+k.text)}</td>
        <td class="w-l">${rin('tasks',k,'text',{aria:'Task'})}</td>
        <td class="w-xs">${rin('tasks',k,'n',{mode:'numeric',aria:'Number of days'})}</td>
        <td class="w-m">${rsel('tasks',k,'rel',[['before','days before start'],['after-start','days after start'],['after-end','days after the end']],{aria:'Counted from'})}</td>
        <td style="white-space:nowrap">${d?nice(d):'<span class="muted">—</span>'}</td>
        <td>${status(k,d)}</td>
        <td>${del('tasks',k.id,'task')}</td></tr>`).join('')}
      </tbody></table></div>
  </section>`;
}

      <li>The planner then works right inside your Notion page.</li>
    </ol>
    <p class="help">The copy buttons above already work today. Embedding is a later step.</p>
  </section>`;
}

/* ---------- export builders ---------- */
const cell=s=>String(s??'').replace(/\|/g,'\\|').replace(/\s*\n\s*/g,' ');
function mdTable(head,rows){return '| '+head.join(' | ')+' |\n| '+head.map(()=>'---').join(' | ')+' |\n'+rows.map(r=>'| '+r.map(cell).join(' | ')+' |').join('\n')+'\n';}
function buildMarkdown(){
  const t=T(),c=calc(t),cur=t.currency,start=parseDate(t.start),L=loads(t,c),out=[];
  const name=id=>(t.people.find(p=>p.id===id)||{}).name||'';
  out.push('# '+t.name);
  out.push([t.location&&('**Where:** '+t.location),start&&('**Start:** '+nice(start)),'**Days:** '+c.days,'**People:** '+c.part+' participants + '+c.lead+' leaders'].filter(Boolean).join(' · '));
  out.push('**Activities:** '+c.acts.map(a=>ACT[a].label).join(', ')+' · **Season:** '+t.season+' · **Coldest:** '+c.minT+' °C');
  if(t.goals)out.push('## Goals\n'+t.goals);
  out.push('## Budget\n'+mdTable(['Item','Category','Price','Qty','Counts','Total'],
    c.rows.map(({c:r,total})=>[r.label,r.cat,money(num(r.amount),cur),r.qty,(UNITS.find(u=>u[0]===r.unit)||['',''])[1],money(total,cur)])
      .concat(t.food.includeInCosts?[['Food','Food',money(num(t.food.costPPD),cur),c.foodDays+' days','per person per day',money(c.foodCost,cur)]]:[])));
  out.push(['- Subtotal: '+money(c.subtotal,cur),'- Safety buffer ('+num(t.buffer)+'%): '+money(c.buffer,cur),'- **Total: '+money(c.total,cur)+'**',
    '- Per participant: '+money(c.perPart,cur)].concat(num(t.margin)?['- **Price per participant (+'+num(t.margin)+'%): '+money(c.price,cur)+'**']:[]).join('\n'));
  out.push('## Food\n- '+c.kcal+' kcal per person per day\n- '+c.kgPPD+' kg food per person per day, '+c.foodDays+' food days\n- Total food: '+r1(c.foodKg)+' kg\n- Gas fuel: about '+r1(c.fuelG/1000)+' kg');
  const meals=t.meals.slice(0,c.foodDays).filter(m=>m.b||m.l||m.d||m.s);
  if(meals.length)out.push('### Meal plan\n'+mdTable(['Day','Breakfast','Lunch','Dinner','Snacks'],t.meals.slice(0,c.foodDays).map((m,i)=>[i<c.days?'Day '+(i+1):'Spare',m.b,m.l,m.d,m.s])));
  const diets=t.people.filter(p=>(p.diet||'').trim());
  if(diets.length)out.push('### Diets\n'+diets.map(p=>'- '+p.name+': '+p.diet).join('\n'));
  const gl=type=>t.gear.filter(g=>g.type===type).map(g=>'- ['+(g.packed?'x':' ')+'] '+g.name+(num(g.qty)!==1?' × '+g.qty:'')).join('\n');
  out.push('## Gear\n### Personal (each person)\n'+(gl('personal')||'- (none)')+'\n### Group\n'+(gl('group')||'- (none)')+'\n### Boats, bikes and worn gear\n'+(gl('transport')||'- (none)'));
  if(t.people.length)out.push('### Who carries what\n'+L.rows.map(r=>'- **'+(r.p.name||'?')+'** ('+kg(r.g)+'): '+(r.items.map(u=>u.name).join(', ')||'personal gear only')).join('\n'));
  if(t.route.length)out.push('## Route\n'+mdTable(['Day','From','To','km','Climb m','Hours','Overnight','Notes'],t.route.map(r=>[r.day,r.from,r.to,r.km,r.up,routeHours(r,c),r.over,r.notes])));
  if(t.risks.length)out.push('## Risk assessment\n'+mdTable(['Hazard','Likelihood','Severity','Score','How we reduce it','Who'],t.risks.map(r=>[r.hazard,r.l,r.s,num(r.l)*num(r.s),r.fix,r.who])));
  const e=t.emergency,em=EMERGENCY[e.country]||EMERGENCY.FI;
  out.push('## Emergency plan\n'+[['Emergency numbers ('+em.name+')',em.lines.map(l=>l[0]+' '+l[1]).join('; ')],['Nearest emergency department',e.hospital],['Evacuation',e.evac],['Phone coverage',e.coverage],['Satellite device',e.satDevice],['Check-in plan',e.checkIn]]
    .concat(t.exportHealth?[['Contact at home',e.homeContact]]:[]).filter(x=>x[1]).map(([k,v])=>'- **'+k+':** '+cell(v)).join('\n')+(e.notes?'\n- '+cell(e.notes):''));
  out.push('## First aid kit\n'+firstAidList(t,c).map(x=>'- ['+(t.firstAid[x.key]?'x':' ')+'] '+x.name+' × '+x.qty).join('\n'));
  out.push('## Timeline\n'+t.tasks.map(k=>({k,d:taskDate(t,k,start)})).sort((a,b)=>(a.d&&b.d)?a.d-b.d:0).map(({k,d})=>'- ['+(k.done?'x':' ')+'] '+(d?nice(d)+' — ':'')+k.text).join('\n'));
  if(t.people.length)out.push('## Group\n'+mdTable(t.exportHealth?['Name','Role','Diet','Health','Swims','Emergency contact']:['Name','Role','Diet','Swims'],
    t.people.map(p=>t.exportHealth?[p.name,p.role,p.diet,p.health,p.swim,p.contact]:[p.name,p.role,p.diet,p.swim])));
  if(t.notes)out.push('## Notes\n'+t.notes);
  out.push('_Made with Retki Planner_');
  return out.join('\n\n')+'\n';
}
function csv(head,rows){const q=v=>{const s=String(v??'');return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};return [head,...rows].map(r=>r.map(q).join(',')).join('\n')+'\n';}
function buildCsv(kind){
  const t=T(),c=calc(t),start=parseDate(t.start),L=loads(t,c);
  const carriers=g=>{const q=Math.max(0,Math.round(num(g.qty)));const ns=[];for(let i=0;i<q;i++){const p=t.people.find(x=>x.id===t.assign[g.id+':'+i]);if(p)ns.push(p.name);}return ns.join('; ');};
  switch(kind){
    case 'gear':return csv(['Item','Type','Grams','Qty','Packed','Carried by'],t.gear.map(g=>[g.name,g.type,g.grams,g.qty,g.packed?'Yes':'No',g.type==='group'?carriers(g):'']));
    case 'costs':return csv(['Item','Category','Price','Qty','Counts','Total','Currency'],c.rows.map(({c:r,total})=>[r.label,r.cat,num(r.amount),num(r.qty),r.unit,total.toFixed(2),t.currency]));
    case 'risks':return csv(['Hazard','Likelihood','Severity','Score','How we reduce it','Who'],t.risks.map(r=>[r.hazard,r.l,r.s,num(r.l)*num(r.s),r.fix,r.who]));
    case 'route':return csv(['Day','Date','From','To','km','Climb m','Hours','Overnight','Notes'],t.route.map(r=>[r.day,start&&num(r.day)?iso(addDays(start,num(r.day)-1)):'',r.from,r.to,num(r.km),num(r.up),routeHours(r,c),r.over,r.notes]));
    case 'tasks':return csv(['Task','Date','Done'],t.tasks.map(k=>{const d=taskDate(t,k,start);return [k.text,d?iso(d):'',k.done?'Yes':'No'];}));
    case 'people':return csv(t.exportHealth?['Name','Role','Diet','Health','Swims','Emergency contact']:['Name','Role','Diet','Swims'],t.people.map(p=>t.exportHealth?[p.name,p.role,p.diet,p.health,p.swim,p.contact]:[p.name,p.role,p.diet,p.swim]));
  }
  return '';
}
function copyOut(text,label){
  ui.exportText=text;ui.exportLabel=label;ui.msg='';
  let p;
  try{p=navigator.clipboard.writeText(text);}catch(e){p=Promise.reject(e);}
  render();
  p.then(()=>{ui.msg='Copied: '+label+'. Now paste it where you need it.';render();})
   .catch(()=>{ui.msg='Copying was blocked here. The text is in the box below. Select it all and copy it yourself.';render();const ta=document.getElementById('export-out');if(ta){ta.focus();ta.select();}});
}
function restoreFrom(text){
  let data;
  try{data=JSON.parse(text);}catch(e){ui.msg='That is not a valid backup. Paste the full text, starting with {';return;}
  const add=tr=>{const b=blankTrip();const n=Object.assign(b,tr,{id:uid(),example:false});n.food=Object.assign(blankTrip().food,tr.food||{});n.emergency=Object.assign(blankTrip().emergency,tr.emergency||{});store.trips[n.id]=n;return n;};
  let last,count=0;
  if(data&&data.trips){Object.values(data.trips).forEach(tr=>{last=add(tr);count++;});}
  else if(data&&Array.isArray(data.costs)&&data.name!==undefined){last=add(data);count=1;}
  if(!last){ui.msg='No trip found in that backup.';return;}
  store.current=last.id;ui.restoreText='';ui.msg='Loaded '+count+(count===1?' trip.':' trips.');
}

/* ---------- main render ---------- */
const TABS=[['trip','Trip'],['group','Group'],['costs','Costs'],['food','Food'],['gear','Gear'],['route','Route'],['safety','Safety'],['timeline','Timeline'],['export','Notion & backup']];
const PANELS={trip:pTrip,group:pGroup,costs:pCosts,food:pFood,gear:pGear,route:pRoute,safety:pSafety,timeline:pTimeline,export:pExport};
const app=document.getElementById('app');

function render(){
  const a=document.activeElement,fid=a&&a.id;
  let s0=null,s1=null;
  try{if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')){s0=a.selectionStart;s1=a.selectionEnd;}}catch(e){}
  const t=T(),c=calc(t),L=loads(t,c);
  const heaviest=L.rows.length?Math.max(...L.rows.map(r=>r.g)):L.base;
  const fa=firstAidList(t,c);
  const checks=t.gear.length+t.tasks.length+fa.length;
  const ticks=t.gear.filter(g=>g.packed).length+t.tasks.filter(k=>k.done).length+fa.filter(x=>t.firstAid[x.key]).length;
  const ready=checks?Math.round(ticks/checks*100):0;
  const start=parseDate(t.start);
  const until=start?Math.round((start-today())/864e5):null;
  const tab=PANELS[store.tab]?store.tab:'trip';
  app.innerHTML=`
  <header class="top">
    <div class="brand"><span class="mark">RETKI</span><span class="brand-sub">Expedition planner: costs, gear, safety</span></div>
    <div class="tripbar">
      <label for="trip-pick" class="sr">Choose a trip</label>
      <select id="trip-pick">${Object.values(store.trips).map(x=>`<option value="${x.id}"${x.id===t.id?' selected':''}>${esc(x.name||'Untitled trip')}</option>`).join('')}</select>
      <button data-act="new-trip">New trip</button>
      <button data-act="dup-trip">Duplicate</button>
      <button class="ghost danger" data-act="del-trip">Delete</button>
    </div>
    ${ui.confirm==='del-trip'?`<div class="confirm" role="alert"><span>Delete “${esc(t.name)}” for good?</span><button class="danger" data-act="del-trip-yes">Yes, delete</button><button data-act="cancel">Cancel</button></div>`:''}
  </header>
  ${t.example?`<div class="banner"><span><b>This is an example trip</b>, so you can see how everything works. Change anything, or start your own.</span><span class="actions"><button class="primary" data-act="new-trip">Start my own trip</button><button class="ghost" data-act="hide-example">Hide this note</button></span></div>`:''}
  <section class="stats" aria-label="Trip summary">
    <div class="stat"><div class="k">Days</div><div class="v">${c.days}</div><div class="s">${until===null?'No start date':until>0?'Starts in '+until+' d':until===0?'Starts today':'Started'}</div></div>
    <div class="stat"><div class="k">People</div><div class="v">${c.people}</div><div class="s">${c.part} + ${c.lead} leaders</div></div>
    <div class="stat"><div class="k">Total cost</div><div class="v">${money(c.total,t.currency)}</div><div class="s">incl. ${esc(num(t.buffer))}% buffer</div></div>
    <div class="stat"><div class="k">${num(t.margin)?'Price':'Cost'} / participant</div><div class="v">${money(num(t.margin)?c.price:c.perPart,t.currency)}</div><div class="s">${num(t.margin)?'+'+esc(num(t.margin))+'% margin':'at cost'}</div></div>
    <div class="stat"><div class="k">Food</div><div class="v">${kg(c.foodKg*1000)}</div><div class="s">${c.kcal.toLocaleString('en-GB')} kcal / day</div></div>
    <div class="stat"><div class="k">Heaviest pack</div><div class="v">${kg(heaviest)}</div><div class="s">${L.rows.length?'after sharing gear':'personal + food only'}</div></div>
    <div class="stat"><div class="k">Ready</div><div class="v">${ready}%</div><div class="s">${ticks} of ${checks} ticked</div></div>
  </section>
  <nav class="tabs" role="tablist" aria-label="Sections">${TABS.map(([k,n])=>`<button class="tab" role="tab" id="tab-${k}" aria-selected="${k===tab}" data-act="tab" data-tab="${k}">${n}</button>`).join('')}</nav>
  <main class="panel" role="tabpanel" aria-labelledby="tab-${tab}">${PANELS[tab]()}</main>`;
  if(fid){const el=document.getElementById(fid);if(el){try{el.focus({preventScroll:true});if(s0!==null&&el.setSelectionRange)el.setSelectionRange(s0,s1);}catch(e){}}}
}

/* ---------- events ---------- */
function apply(el){
  const d=el.dataset,t=T(),val=el.type==='checkbox'?el.checked:el.value;
  if(el.id==='trip-pick'){store.current=val;ui.confirm=null;ui.exportText='';ui.msg='';return true;}
  if(d.path){setPath(t,d.path,val);return true;}
  if(d.list){const row=(t[d.list]||[]).find(r=>r.id===d.id);if(row){row[d.f]=val;return true;}return false;}
  if(d.activity){const set=new Set(t.activities);el.checked?set.add(d.activity):set.delete(d.activity);t.activities=Object.keys(ACT).filter(k=>set.has(k));return true;}
  if(d.fa){t.firstAid[d.fa]=el.checked;return true;}
  if(d.assign!==undefined){if(val)t.assign[d.assign]=val;else delete t.assign[d.assign];return true;}
  return false;
}
app.addEventListener('input',e=>{
  const el=e.target;
  if(el.type==='checkbox'||el.type==='file')return;
  if(el.id==='restore-text'){ui.restoreText=el.value;return;}
  if(el.id==='export-out')return;
  if(apply(el)){persist();render();}
});
app.addEventListener('change',e=>{
  const el=e.target;
  if(el.type==='file'){
    const f=el.files&&el.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{restoreFrom(String(r.result));persist();render();};
    r.onerror=()=>{ui.msg='Could not read that file.';render();};
    r.readAsText(f);return;
  }
  if(el.type==='checkbox'&&apply(el)){persist();render();}
});
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const t=T(),act=b.dataset.act;
  switch(act){
    case 'tab':store.tab=b.dataset.tab;ui.msg='';try{history.replaceState(null,'','#'+store.tab);}catch(x){}persist();render();window.scrollTo({top:0});return;
    case 'new-trip':{const n=blankTrip();store.trips[n.id]=n;store.current=n.id;store.tab='trip';break;}
    case 'dup-trip':{const n=JSON.parse(JSON.stringify(t));n.id=uid();n.name=t.name.replace(/ \(example\)$/,'')+' (copy)';n.example=false;store.trips[n.id]=n;store.current=n.id;break;}
    case 'del-trip':ui.confirm='del-trip';render();return;
    case 'cancel':ui.confirm=null;render();return;
    case 'del-trip-yes':{delete store.trips[t.id];ui.confirm=null;const ids=Object.keys(store.trips);if(!ids.length){const n=blankTrip();store.trips[n.id]=n;store.current=n.id;}else store.current=ids[0];break;}
    case 'hide-example':t.example=false;break;
    case 'del-row':{
      const list=b.dataset.list,id=b.dataset.id;t[list]=t[list].filter(r=>r.id!==id);
      if(list==='gear')Object.keys(t.assign).forEach(k=>{if(k.startsWith(id+':'))delete t.assign[k];});
      if(list==='people')Object.keys(t.assign).forEach(k=>{if(t.assign[k]===id)delete t.assign[k];});
      break;}
    case 'add-cost':t.costs.push({id:uid(),cat:'Other',label:'',amount:'',qty:'1',unit:'group'});break;
    case 'add-person':t.people.push({id:uid(),name:'',role:'participant',diet:'',health:'',swim:'unknown',contact:''});break;
    case 'sync-counts':{const l=t.people.filter(p=>p.role==='leader').length;t.leaders=String(l);t.participants=String(t.people.length-l);break;}
    case 'add-gear':t.gear.unshift({id:uid(),name:'',type:'personal',grams:'',qty:'1',packed:false});ui.gearFilter='all';break;
    case 'suggest-gear':suggestGear(t);break;
    case 'gear-filter':ui.gearFilter=b.dataset.f;break;
    case 'share-gear':shareOut(t);break;
    case 'clear-assign':t.assign={};break;
    case 'add-route':{const last=t.route.reduce((m,r)=>Math.max(m,num(r.day)),0);t.route.push({id:uid(),day:String(last+1),from:'',to:'',km:'',up:'',hours:'',over:'',notes:''});break;}
    case 'add-risk':t.risks.push({id:uid(),hazard:'',l:'2',s:'2',fix:'',who:''});break;
    case 'suggest-risks':suggestRisks(t);break;
    case 'add-task':t.tasks.push({id:uid(),n:'7',rel:'before',text:'',done:false});break;
    case 'copy-md':copyOut(buildMarkdown(),'whole plan for Notion');return;
    case 'copy-csv':copyOut(buildCsv(b.dataset.kind),b.textContent.trim());return;
    case 'copy-json':copyOut(JSON.stringify(t,null,1),'backup of this trip');return;
    case 'copy-json-all':copyOut(JSON.stringify(store,null,1),'backup of all trips');return;
    case 'restore':restoreFrom(ui.restoreText);break;
    default:return;
  }
  persist();render();
});

store=load();
const h=(location.hash||'').slice(1);
if(PANELS[h])store.tab=h;
render();
})();
</script>
